  const s = session;
  const m = MODULES[s.moduleIdx];
  const sub = sentOwner(m, s.subId);
  const pct = sentenceProgPct(s.step);
  const progLbl = sentenceProgLabel(s.step);
  const subName = sub ? subModuleLabel(sub, (m.subModules||[]).indexOf(sub), m) : 'Cümle Grubu';

  let badges = `<span class="stage-badge example-tag">Cümle Grubu</span><span class="stage-badge">${s.stageType}</span>`;
  if(s.colorFilter){
    const cfHex = wordColorHex(s.colorFilter);
    const bg = cfHex || '#8A8F8A';
    badges += `<span class="stage-badge color-tag" style="background:${bg};">${esc(colorFilterLabel(s.colorFilter))}</span>`;
  }

  let head = `
  <div class="lesson-head">
    <div class="lesson-head-row">
      <span class="back-link" id="backBtn">← Modüller</span>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${badges}</div>
    </div>
    <div class="rep-track"><div class="rep-fill" style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;">
      <span class="counter">${esc(moduleLabel(m, s.moduleIdx))} · ${esc(subName)} · Tekrar ${s.rep+1}/${REPS}</span>
      <span class="counter">${progLbl}</span>
    </div>
  </div>`;

  let body = '';
  switch(s.stageType){
    case 'HÖM': body = renderSentenceHOM(s); break;
    case 'TAHMİN': body = renderSentenceGuess(s, 'de2tr'); break;
    case 'TERS': body = renderSentenceGuess(s, 'tr2de'); break;
    case 'MİNİ TEST': body = renderSentenceMiniTest(s); break;
  }
  return head + '<div id="lessonBody">' + body + '</div>';
}

function renderSentenceMiniTest(s){
  if(s.idx >= s.order.length) return renderSentencePassSummary(s);
  const sc = s.order[s.idx];
  const scHex = wordColorHex(sc.color);
  const cardStyle = scHex ? `border-left:5px solid ${scHex}; background-color:${hexToRgbA(scHex, 0.08)};` : '';
  const chipName = (WORD_COLORS.find(c=>c.key===sc.color)||{}).name || '';
  if(!s.mcOptions || s.mcOptions._forId !== sc.id){
    const pool = s.order.filter(x => x.id !== sc.id);
    const seen = new Set([sc.tr]);
    const distractors = [];
    for(const cand of seededShuffle(pool, s.seed + s.idx + 50)){
      if(!seen.has(cand.tr)){ seen.add(cand.tr); distractors.push(cand); }
      if(distractors.length >= 3) break;
    }
    const combined = seededShuffle([sc, ...distractors], s.seed + s.idx + 51);
    s.mcOptions = combined.map(x => ({ id: x.id, text: x.tr }));
    s.mcOptions._forId = sc.id;
    s.mcOptions._correctText = sc.tr;
    s.mcSelected = null; s.mcResolved = false;
  }
  const optsHtml = s.mcOptions.map(o => {
    let cls = '';
    if(s.mcResolved){
      if(o.text === s.mcOptions._correctText) cls = 'correct';
      else if(o.text === s.mcSelected) cls = 'wrong';
    }
    return `<div class="mc-opt ${cls} ${s.mcResolved?'disabled':''}" data-opt-text="${esc(o.text)}" style="font-size:12.5px;line-height:1.4;text-align:left;">${esc(o.text)}</div>`;
  }).join('');
  return `
  <div class="stage-card" style="${cardStyle}">
    <span class="hint">Doğru Türkçe karşılığı seç</span>
    ${scHex ? `<div><span class="color-chip" style="background:${scHex};">${esc(chipName)}</span></div>` : ''}
    <div style="font-size:clamp(15px, 3.2vw, 20px);font-style:italic;font-weight:600;line-height:1.45;${deColorStyle(scHex)}word-break:break-word;overflow-wrap:anywhere;margin-bottom:4px;">${esc(sc.de)}</div>
    <div class="mc-grid" style="grid-template-columns:1fr;">${optsHtml}</div>
    <div class="counter" style="display:flex;align-items:center;gap:6px;justify-content:center;">
      ${scHex?`<span class="lesson-color-dot" style="background:${scHex};"></span>`:''}
      ${s.idx+1} / ${s.order.length} &nbsp;·&nbsp; Doğru: ${s.correctCount}
    </div>
    ${s.mcResolved ? '<div class="btn-row"><button class="btn btn-primary" id="testNext">Devam et</button></div>' : ''}
  </div>`;
}

function attachSentenceHOM(){
  const dur = 3800;
  const circumference = 276;
  const start = Date.now();
  const ring = document.getElementById('ringFg');
  let done = false;
  const tick = ()=>{
    if(done || !session || session.mode !== 'sentence') return;
    const elapsed = Date.now() - start;
    const frac = Math.min(elapsed / dur, 1);
    if(ring) ring.setAttribute('stroke-dashoffset', String(circumference * frac));
    if(frac >= 1){ done = true; advanceSentenceHOM(); }
  };
  activeTimer = setInterval(tick, 60);
  const skip = document.getElementById('homSkip');
  if(skip) skip.onclick = ()=>{ if(done) return; done = true; advanceSentenceHOM(); };
}
function advanceSentenceHOM(){
  clearActiveTimer();
  if(!session || session.mode !== 'sentence') return;
  if(session.idx >= session.order.length - 1){ completeSentenceStep(); return; }
  session.idx += 1;
  const bodyEl = document.getElementById('lessonBody');
  if(bodyEl){
    bodyEl.innerHTML = renderSentenceHOM(session);
    attachSentenceHOM();
  } else {
    render();
  }
}

function checkSentenceGuess(mode){
  const s = session;
  const sc = s.order[s.idx];
  const input = s.inputVal || '';
  let correct = false;
  let correctVal = '';
  if(mode === 'de2tr'){
    correct = looseTrMatch(input, sc.tr);
    correctVal = sc.tr;
  } else {
    correct = looseDeMatch(input, sc.de);
    correctVal = sc.de;

  if(correct){
    s.correctCount++;

    s.feedbackType = 'ok';

    s.feedbackType = 'bad';

}

function checkGuess(mode){
  const s = session;
  const w = s.order[s.idx];
  let correct, correctAnswer;
  if(mode==='de2tr'){
    correct = isCorrectTr(s.inputVal, w.tr);
    correctAnswer = w.tr.join(' / ');
  } else {
    correct = normalizeDe(s.inputVal)===normalizeDe(w.de);
    correctAnswer = w.de;
  }
  if(correct){
    s.correctCount++;
    s.feedback = 'Doğru! ✓'; s.feedbackType = 'ok';
  } else {
    s.wrongCount++;
    w.errors = (w.errors||0)+1;
    saveProgress();
    s.feedback = 'Doğru cevap: '+correctAnswer; s.feedbackType = 'bad';
  }
  render();

function renderMatch(s){
  if(!s.leftShuffled){
    s.leftShuffled = seededShuffle(s.order, s.seed+1);
    s.rightShuffled = seededShuffle(s.order, s.seed+2);
    s.matched = [];
    s.selectedLeft = null;
    s.wrongFlashKey = null;
  }
  const done = s.matched.length === s.order.length;
  const leftHtml = s.leftShuffled.map(w=>{
    const isMatched = s.matched.includes(w.id);
    const isSel = s.selectedLeft===w.id;
    const wHex = wordColorHex(w.color);
    const cls = isMatched? 'correct' : (isSel? 'selected':'');
    const style = wHex
      ? `box-shadow:inset 4px 0 0 ${wHex}; color:${wHex}; background:${hexToRgbA(wHex, 0.13)}; border-left:3px solid ${wHex}; padding-left:10px;`
      : '';
    return `<div class="match-tile ${cls}" style="${style}" data-key="${w.id}" data-side="left">${esc(w.de)}</div>`;
  }).join('');
  const rightHtml = s.rightShuffled.map(w=>{
    const isMatched = s.matched.includes(w.id);
    const wrongFlash = s.wrongFlashKey===w.id;
    const cls = isMatched? 'correct' : (wrongFlash?'wrong':'');
    return `<div class="match-tile ${cls}" data-key="${w.id}" data-side="right">${esc(w.tr[0])}</div>`;
  }).join('');
  return `
  <div class="stage-card" style="align-items:stretch;">
    <span class="hint" style="text-align:center;">Almanca kelimeyi doğru Türkçe anlamıyla eşleştir</span>
    <div class="match-grid">
      <div class="match-col">${leftHtml}</div>
      <div class="match-col">${rightHtml}</div>
    </div>
    <div class="counter" style="text-align:center;">${s.matched.length} / ${s.order.length} eşleşti</div>
    ${done? '<div class="btn-row"><button class="btn btn-primary" id="matchContinue">Devam et</button></div>':''}
  </div>`;
}
function attachMatch(){
  document.querySelectorAll('.match-tile').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.key, side = el.dataset.side;
      const s = session;
      if(s.matched.includes(key)) return;
      if(side==='left'){ s.selectedLeft = key; render(); return; }
      if(side==='right'){
        if(!s.selectedLeft) return;
        if(s.selectedLeft===key){
          s.matched.push(key);
          s.selectedLeft=null;
          render();
        } else {
          const w = s.order.find(x=>x.id===s.selectedLeft);
          if(w){ w.errors = (w.errors||0)+1; saveProgress(); }
          s.wrongFlashKey = key;
          render();
          setTimeout(()=>{ if(!session) return; session.wrongFlashKey=null; session.selectedLeft=null; render(); }, 500);
        }
      }
    };
  });
  const cont = document.getElementById('matchContinue');
  if(cont) cont.onclick = ()=> completeStep();
}

function renderMiniTest(s){
  const words = s.order;
  if(s.idx >= words.length){
    const total = words.length;
    const pct = Math.round((s.correctCount/total)*100);
    const passed = pct>=70;
    return `
    <div class="stage-card">
      <h2 style="font-size:22px;">Mini test sonucu</h2>
      <div class="score-tag" style="color:${passed?'var(--green)':'var(--coral)'}">${s.correctCount}/${total} doğru (%${pct})</div>
      <p class="hint">${passed? 'Bu tekrarı başarıyla tamamladın.' : 'Başarı eşiği %70. Tekrar dene.'}</p>
      <div class="btn-row"><button class="btn btn-primary" id="testContinue">${passed?'Devam et':'Tekrar dene'}</button></div>
    </div>`;
  }
  if(words.length < 2){
    return `<div class="stage-card">
      <h2 style="font-size:20px;">Yetersiz Kelime</h2>
      <p class="hint">Mini test için en az 2 kelime gerekir.</p>
      <div class="btn-row"><button class="btn btn-primary" id="testSkip">Devam et</button></div>
    </div>`;
  }
  const w = words[s.idx];
  const wHex = wordColorHex(w.color);
  const cardStyle = wHex ? `border-left:5px solid ${wHex}; background-color:${hexToRgbA(wHex, 0.08)};` : '';
  if(!s.mcOptions || s.mcOptions._forId !== w.id){
    const distractorPool = words.filter(x=>x.id!==w.id);
    const seenTrs = new Set([w.tr[0]]);
    const distractors = [];
    for(const cand of seededShuffle(distractorPool, s.seed+s.idx+50)){
      const tr = cand.tr[0];
      if(!seenTrs.has(tr)){ seenTrs.add(tr); distractors.push(cand); }
      if(distractors.length >= 3) break;
    }
    const combined = seededShuffle([w, ...distractors], s.seed+s.idx+51);
    s.mcOptions = combined.map(x => ({ id: x.id, text: x.tr[0] }));
    s.mcOptions._forId = w.id;
    s.mcOptions._correctText = w.tr[0];
    s.mcSelected = null; s.mcResolved = false;
  }
  const optsHtml = s.mcOptions.map(o=>{
    let cls='';
    if(s.mcResolved){
      if(o.text===s.mcOptions._correctText) cls='correct';
      else if(o.text===s.mcSelected) cls='wrong';
    }
    return `<div class="mc-opt ${cls} ${s.mcResolved?'disabled':''}" data-opt-text="${esc(o.text)}">${esc(o.text)}</div>`;
  }).join('');
  return `
  <div class="stage-card" style="${cardStyle}">
    <span class="hint">Doğru Türkçe karşılığı seç</span>
    ${wHex ? `<div>${wordChipHtml(w)}</div>` : ''}
    <div class="word-de" style="${deColorStyle(wHex)}">${esc(w.de)}</div>
    <div class="mc-grid">${optsHtml}</div>
    ${s.mcResolved ? exampleDisplayHtml(w, s.exampleMode ? 'big' : '', s.rep) : ''}
    <div class="counter" style="display:flex;align-items:center;gap:6px;justify-content:center;">
      ${wHex?`<span class="lesson-color-dot" style="background:${wHex};"></span>`:''}
      ${s.idx+1} / ${words.length} &nbsp;·&nbsp; Doğru: ${s.correctCount}
    </div>
    ${s.mcResolved? '<div class="btn-row"><button class="btn btn-primary" id="testNext">Devam et</button></div>':''}
  </div>`;
}
function attachMiniTest(){
  document.querySelectorAll('.mc-opt').forEach(el=>{
    el.onclick = ()=>{
      if(session.mcResolved) return;
      session.mcSelected = el.dataset.optText;
      session.mcResolved = true;
      if(session.mcSelected===session.mcOptions._correctText){ session.correctCount++; }
      else {
        session.wrongCount++;
        const w = session.order[session.idx];
        w.errors = (w.errors||0)+1;
        saveProgress();
      }
      render();
    };
  });
  const nxt = document.getElementById('testNext');
  if(nxt) nxt.onclick = ()=>{ session.idx++; session.mcOptions=null; render(); };
  const cont = document.getElementById('testContinue');
  if(cont) cont.onclick = ()=>{
    const total = session.order.length;
    const pct = Math.round((session.correctCount/total)*100);
    if(pct>=70){ completeStep(); }
    else {
      session.idx=0; session.correctCount=0; session.wrongCount=0; session.mcOptions=null;
      render();
    }
  };
  const skip = document.getElementById('testSkip');
  if(skip) skip.onclick = ()=> completeStep();
}

function renderCumle(s){
  const words = s.order;
  if(s.idx >= words.length){ return renderPassSummary(s); }
  const w = words[s.idx];
  const wHex = wordColorHex(w.color);
  const cardStyle = wHex ? `border-left:5px solid ${wHex}; background-color:${hexToRgbA(wHex, 0.08)};` : '';
  const exObj = exampleOf(w, s.rep) || { de:'', tr:'' };
  const exDe = exObj.de || '';
  const exTr = exObj.tr || '';
  const hasTr = exTr.trim().length > 0;
  return `
  <div class="stage-card" style="${cardStyle}">
    <span class="hint">Almanca cümleyi Türkçeye çevir</span>
    ${wHex ? `<div>${wordChipHtml(w)}</div>` : ''}
    <div style="font-size:12px;color:var(--ink-soft);">"${esc(w.de)}" — ${esc(w.tr[0])}</div>
    <div class="word-de" style="font-size:clamp(18px, 4vw, 24px);${deColorStyle(wHex)}line-height:1.35;font-style:italic;font-weight:600;word-break:break-word;overflow-wrap:anywhere;">${esc(exDe)}</div>
    ${hasTr ? `
    <div class="input-row">
      <input type="text" id="cumleInput" autocomplete="off" placeholder="Türkçe çevirisini yaz..." value="${esc(s.inputVal||'')}" ${s.feedback?'disabled':''}>
    </div>
    <div class="feedback ${s.feedbackType||''}">${esc(s.feedback||'')}</div>
    <div class="btn-row">
      ${s.feedback ? '<button class="btn btn-primary" id="cumleNext">Devam et</button>' : '<button class="btn btn-primary" id="cumleCheck">Kontrol et</button>'}
    </div>` : `
    <div class="hint">Bu cümlede Türkçe çeviri kayıtlı değil. Sadece cümleyi okuyup devam et.</div>
    <div class="btn-row"><button class="btn btn-primary" id="cumleNext">Devam et</button></div>`}
    <div class="counter" style="display:flex;align-items:center;gap:6px;justify-content:center;">
      ${wHex?`<span class="lesson-color-dot" style="background:${wHex};"></span>`:''}
      ${s.idx+1} / ${words.length} &nbsp;·&nbsp; Doğru: ${s.correctCount}
    </div>
  </div>`;
}
function attachCumle(){
  const input = document.getElementById('cumleInput');
  if(input){
    input.focus();
    input.oninput = (e)=>{ session.inputVal = e.target.value; };
    input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); checkCumle(); } };
  }
  const chk = document.getElementById('cumleCheck');
  if(chk) chk.onclick = ()=> checkCumle();
  const nxt = document.getElementById('cumleNext');
  if(nxt){
    nxt.onclick = ()=> nextCumle();
    KEY_HANDLER = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); clearKeyHandler(); nextCumle(); } };
    document.addEventListener('keydown', KEY_HANDLER);
  }
}
function checkCumle(){
  const s = session;
  const w = s.order[s.idx];
  const exTr = ((exampleOf(w, s.rep) || {}).tr || '').trim();
  if(!exTr){ nextCumle(); return; }
  const correct = looseTrMatch(s.inputVal, exTr);
  if(correct){
    s.correctCount++;
    s.feedback = 'Doğru! ✓'; s.feedbackType = 'ok';
  } else {
    s.wrongCount++;
    w.errors = (w.errors||0)+1;
    saveProgress();
    s.feedback = 'Doğru cevap: '+exTr; s.feedbackType = 'bad';
  }
  render();
}
function nextCumle(){
  session.idx++; session.inputVal=''; session.feedback=null; session.feedbackType=null;
  render();
}

function attachLessonEvents(){
  if(session && session.mode === 'sentence'){ attachSentenceLessonEvents(); return; }
  const back = document.getElementById('backBtn');
  if(back) back.onclick = goList;
  const s = session;
  switch(s.stageType){
    case 'HÖM': attachHOM(); break;
    case 'TAHMİN': (s.idx>=s.order.length)?attachPassSummary():attachGuess(s.mode==='example' ? 'de2tr' : (s.rep%2===0?'de2tr':'tr2de')); break;
    case 'TERS': (s.idx>=s.order.length)?attachPassSummary():attachGuess(s.rep%2===0?'tr2de':'de2tr'); break;
    case 'EŞLEŞTİRME': attachMatch(); break;
    case 'MİNİ TEST': attachMiniTest(); break;
    case 'CÜMLE': (s.idx>=s.order.length)?attachPassSummary():attachCumle(); break;
  }
}

function renderModuleComplete(){
  if(session && session.mode === 'sentence'){
    const m = MODULES[session.moduleIdx];
    const sub = sentOwner(m, session.subId);
    const subName = sub ? subModuleLabel(sub, (m.subModules||[]).indexOf(sub), m) : 'Cümle Grubu';
    return `
    <div class="complete-wrap">
      <span class="eyebrow">Cümle grubu tamamlandı</span>
      <h2>${esc(subName)} ✓</h2>
      <p>Bu cümle grubunda ${REPS} tekrar döngüsünü (HÖM · TAHMİN · TERS · MİNİ TEST) tamamladın.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="reviewBtn">Bu modülü incele</button>
      </div>
    </div>`;
  }
  const mod = MODULES[CUR_MODULE];
  const nextExists = CUR_MODULE < MODULES.length-1;
  return `
  <div class="complete-wrap">
    <span class="eyebrow">Modül tamamlandı</span>
    <h2>${esc(moduleLabel(mod,CUR_MODULE))} ✓</h2>
    <p>${mainWords(mod).length} kelimeyi 14 farklı tekrar döngüsünden geçirdin.</p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="reviewBtn">Bu modülü incele</button>
      ${nextExists? '<button class="btn btn-primary" id="nextModBtn">Sonraki modüle geç</button>' : ''}
    </div>
  </div>`;
}
function attachCompleteEvents(){
  const rev = document.getElementById('reviewBtn');
  if(rev) rev.onclick = ()=>{ SCREEN='list'; CUR_SUBMODULE=null; render(); };
  if(session && session.mode === 'sentence') return;
  const nxt = document.getElementById('nextModBtn');
  if(nxt) nxt.onclick = ()=>{ CUR_MODULE++; SCREEN='list'; CUR_SUBMODULE=null; render(); };
}

async function requestPersistentStorage(){
  try{ if(navigator.storage && navigator.storage.persist){ await navigator.storage.persist(); } }catch(e){}
}

window.addEventListener('storage', async (e)=>{
  if(!isUnlocked_()) return;
  if(e.key === 'osd:osd_data_v2'){
    await loadProgress();
    if(SCREEN==='list' || SCREEN==='edit'){ render(); }
  }
});

/* ---------------- ŞİFRE EKRANI ---------------- */
const PASS_HASH = 'fa3cfb3f1bb823aa9501f88f1f95f732ee6fef2c3a48be7f1d38037b216a549f';
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function passwordOk(input){
  try{
    if(window.crypto && crypto.subtle) return (await sha256Hex(input)) === PASS_HASH;
  }catch(e){}
  return input === '1223';
}
// Sayfa/sekme/pencere kapanınca (ya da yenilenince) kilit tekrar devreye girer
window.addEventListener('pagehide', ()=>{ try{ sessionStorage.removeItem('osd_unlocked'); }catch(e){} });
function isUnlocked_(){ try{ return sessionStorage.getItem('osd_unlocked') === '1'; }catch(e){ return false; } }
function renderGate(){
  root.innerHTML = `
  <div class="stage-card" style="align-items:stretch;text-align:left;max-width:420px;margin:12vh auto 0;min-height:0;">
    <span class="hint">Şifre</span>
    <div class="input-row" style="max-width:none;">
      <input type="password" id="gatePass" inputmode="numeric" autocomplete="off" placeholder="Şifreyi gir">
    </div>
  </div>`;
  const inp = document.getElementById('gatePass');
  let busy = false;
  const go = async ()=>{
    if(busy || !inp.value) return;
    busy = true;
    const ok = await passwordOk(inp.value.trim());
    busy = false;
    if(ok){
      try{ sessionStorage.setItem('osd_unlocked','1'); }catch(e){}
      startApp();
    } else {
      inp.value = '';
      inp.style.borderColor = 'var(--coral)';
      setTimeout(()=>{ inp.style.borderColor = ''; }, 700);
      inp.focus();
    }
  };
  inp.oninput = ()=>{ if(inp.value.length >= 4) go(); };
  inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } };
  inp.focus();
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
let INSTALL_PROMPT = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  INSTALL_PROMPT = e;
  if(SCREEN==='list') render();
});
window.addEventListener('appinstalled', ()=>{ INSTALL_PROMPT = null; if(SCREEN==='list') render(); });
async function installApp(){
  if(!INSTALL_PROMPT) return;
  const ev = INSTALL_PROMPT; INSTALL_PROMPT = null;
  try{ await ev.prompt(); await ev.userChoice; }catch(e){}
  if(SCREEN==='list') render();
}
async function startApp(){
  await requestPersistentStorage();
  await loadProgress();
  await tryReconnectLinkedFile();
  SCREEN = 'list';
  render();
}
(function init(){
  if(isUnlocked_()) startApp(); else renderGate();
})();

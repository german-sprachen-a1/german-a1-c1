<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6F5EF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanca">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ÖSD Almanca Kelime Öğrenme Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5EF; --surface:#FFFFFF; --surface-2:#EFEDE3;
    --ink:#232A25; --ink-soft:#6B7570; --line:#E3E0D2;
    --teal:#1F7A6C; --teal-dark:#155A50; --teal-tint:#E4F1EC;
    --amber:#E29A3B; --amber-tint:#FBEEDA;
    --coral:#D96C4F; --coral-tint:#FBEAE4;
    --green:#3F9142; --green-tint:#E7F3E4;
    --radius:18px;
    --shadow: 0 1px 2px rgba(35,42,37,0.04), 0 8px 24px rgba(35,42,37,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  #app{max-width:760px;margin:0 auto;padding:20px 16px 64px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-dark);font-weight:600;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; font-weight:600;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 22px;}
  .brand{display:flex;flex-direction:column;gap:3px;}
  .brand h1{font-size:20px;letter-spacing:-.01em;}
  .reset-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);font-family:'Inter';font-size:12px;padding:7px 12px;border-radius:999px;cursor:pointer;}
  .reset-btn:hover{border-color:var(--coral);color:var(--coral);}
  .path{position:relative;padding:8px 0 8px 34px;}
  .path::before{content:'';position:absolute;left:15px;top:26px;bottom:26px;width:2px;background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px);}
  .node{position:relative;display:flex;gap:16px;align-items:flex-start;margin-bottom:14px;}
  .node-dot{position:absolute;left:-34px;top:2px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:12px;font-weight:600;background:var(--surface);border:2px solid var(--line);color:var(--ink-soft);z-index:1;}
  .node-dot.done{background:var(--teal);border-color:var(--teal);color:#fff;}
  .node-dot.current{background:var(--amber-tint);border-color:var(--amber);color:var(--amber);}
  .card-module{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease;}
  .card-module:not(.locked):hover{transform:translateY(-1px);}
  .card-module-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .card-module h3{font-size:16px;}
  .card-module .cat{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .progress-track{height:5px;background:var(--surface-2);border-radius:99px;margin-top:10px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--teal);border-radius:99px;}
  .pill{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);background:var(--surface-2);padding:2px 8px;border-radius:99px;white-space:nowrap;}
  .pill.done{background:var(--green-tint);color:var(--green);}
  .color-picker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .color-dot{width:26px;height:26px;border-radius:99px;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;background:var(--cdot,var(--surface-2));}
  .color-dot.none{background:var(--surface);position:relative;}
  .color-dot.none::after{content:'';position:absolute;left:50%;top:3px;bottom:3px;width:1.5px;background:var(--ink-soft);transform:rotate(45deg);}
  .color-dot.active{box-shadow:0 0 0 2px var(--ink);}
  .color-mini{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--cdot);margin-right:6px;vertical-align:middle;}
  .color-chip{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono';font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.05em;text-transform:uppercase;color:#fff;}
  .lesson-head{margin-bottom:18px;}
  .lesson-head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap;}
  .back-link{font-size:13px;color:var(--ink-soft);cursor:pointer;text-decoration:none;}
  .back-link:hover{color:var(--teal-dark);}
  .stage-badge{font-family:'IBM Plex Mono';font-size:11px;font-weight:600;letter-spacing:.06em;background:var(--teal-tint);color:var(--teal-dark);padding:4px 10px;border-radius:99px;}
  .stage-badge.color-tag{color:#fff;}
  .stage-badge.example-tag{background:var(--teal);color:#fff;}
  .rep-track{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
  .rep-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:99px;transition:width .3s ease;}
  .lesson-title{font-size:22px;margin-top:10px;}
  .stage-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 24px;box-shadow:var(--shadow);text-align:center;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative;}
  .word-de{font-family:'Fraunces',serif;font-size:38px;font-weight:600;letter-spacing:-.01em;}
  .word-tr{font-size:19px;color:var(--teal-dark);font-weight:500;}

  .ring-wrap{position:relative;width:110px;height:110px;margin:0 auto;}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:var(--surface-2);stroke-width:5;}
  .ring-fg{fill:none;stroke:var(--amber);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .1s linear;}
  .ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .hom-word-block{width:100%;max-width:100%;padding:0 8px;text-align:center;box-sizing:border-box;}
  .hom-word-block .word-de{font-size:clamp(24px, 6.5vw, 36px);word-break:break-word;overflow-wrap:anywhere;line-height:1.15;margin-bottom:6px;}
  .hom-word-block .word-tr{font-size:clamp(15px, 4vw, 19px);word-break:break-word;overflow-wrap:anywhere;line-height:1.2;}

  .word-example{margin-top:8px;padding:8px 12px;background:rgba(0,0,0,0.04);border-radius:10px;border-left:3px solid var(--amber);text-align:left;}
  .word-example .we-de{font-style:italic;font-size:13px;line-height:1.4;}
  .word-example .we-tr{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .word-example.mini{padding:5px 9px;margin-top:5px;}
  .word-example.mini .we-de{font-size:12px;}
  .word-example.mini .we-tr{font-size:10px;}
  .word-example.big{padding:12px 16px;margin-top:14px;}
  .word-example.big .we-de{font-size:15px;}
  .word-example.big .we-tr{font-size:12px;}
  .word-example.huge{padding:16px 20px;margin-top:16px;background:rgba(31,122,108,0.06);border-left-width:4px;}
  .word-example.huge .we-de{font-size:17px;line-height:1.45;}
  .word-example.huge .we-tr{font-size:13px;margin-top:6px;}

  .btn{font-family:'Inter';font-weight:600;font-size:14px;border:none;border-radius:12px;padding:12px 22px;cursor:pointer;transition:transform .08s ease, background .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:var(--surface-2);color:var(--ink);}
  .btn-ghost:hover{background:var(--line);}
  .btn-example{background:var(--surface);color:var(--teal-dark);border:1.5px solid var(--teal);}
  .btn-example:hover{background:var(--teal-tint);}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .input-row{display:flex;gap:8px;width:100%;max-width:340px;}
  input[type=text],input[type=password]{flex:1;font-family:'Inter';font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);}
  input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--teal);}
  textarea.bulk-input{width:100%;font-family:'IBM Plex Mono',monospace;font-size:13.5px;line-height:1.6;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:120px;}
  textarea.bulk-input:focus{outline:none;border-color:var(--teal);}
  .feedback{font-size:14px;font-weight:600;min-height:20px;}
  .feedback.ok{color:var(--green);}
  .feedback.bad{color:var(--coral);}
  .hint{font-size:12px;color:var(--ink-soft);}
  .match-grid{display:flex;gap:14px;width:100%;justify-content:center;}
  .match-col{display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-width:0;max-width:280px;}
  .match-tile{overflow-wrap:anywhere;word-break:break-word;hyphens:auto;background:var(--surface-2);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;text-align:left;transition:all .12s ease;}
  .match-tile.selected{border-color:var(--amber);background:var(--amber-tint);}
  .match-tile.correct{border-color:var(--green);background:var(--green-tint);color:var(--green);cursor:default;}
  .match-tile.wrong{border-color:var(--coral);background:var(--coral-tint);}
  .mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px;}
  .mc-opt{overflow-wrap:anywhere;word-break:break-word;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:12px 10px;font-size:14px;cursor:pointer;text-align:center;}
  .mc-opt.correct{border-color:var(--green);background:var(--green-tint);color:var(--green);}
  .mc-opt.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral);}
  .mc-opt.disabled{cursor:default;}
  .example-block{width:100%;text-align:left;background:var(--surface-2);border-radius:14px;padding:16px 18px;}
  .example-block.word-selected{background:var(--amber-tint);border:1.5px solid var(--amber);}
  .example-de{font-family:'Fraunces',serif;font-size:19px;margin-bottom:4px;}
  .example-tr{font-size:14px;color:var(--ink-soft);}
  .counter{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);}
  .score-tag{font-family:'IBM Plex Mono';font-size:13px;font-weight:600;}
  .complete-wrap{text-align:center;padding:50px 16px;}
  .complete-wrap h2{font-size:26px;margin-bottom:8px;}
  .complete-wrap p{color:var(--ink-soft);font-size:14px;margin-bottom:20px;}
  .empty-note{text-align:center;color:var(--ink-soft);font-size:13px;padding:30px 0;}
  .lesson-color-dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;}
  /* ---- Kelime satırı (telefonda sığması için sarmalanır) ---- */
  .wrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .wrow-main{display:flex;align-items:flex-start;gap:10px;flex:1 1 180px;min-width:0;}
  .wrow-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 1 auto;max-width:100%;}
  .wrow-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .sent-panel{margin:-2px 0 10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);}
  .example-de,.example-tr,.word-de,.word-tr,.cat,.hint{overflow-wrap:anywhere;word-break:break-word;}
  [data-sent-item]{flex-wrap:wrap;}
  [data-sent-item] > div:first-child{flex:1 1 180px;min-width:0;}
  .top{flex-wrap:wrap;gap:10px;}
  .card-module-top{flex-wrap:wrap;}
  .card-module-top h3{min-width:0;overflow-wrap:anywhere;}
  img,svg,video{max-width:100%;}
  @media (max-width:560px){
    #app{padding:16px 12px 56px;}
    .wrow-side{width:100%;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;}
    .wrow-btns{justify-content:flex-start;}
    [data-sent-item] > div:last-child{width:100%;align-items:flex-start;}
    [data-sent-item] > div:last-child > div{justify-content:flex-start;}
    .example-block{padding:14px;}
    .stage-card{padding:24px 16px;}
    .btn{padding:11px 16px;}
  }
  @media (max-width:480px){
    .word-de{font-size:30px;}
    .mc-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   YARDIMCI FONKSİYONLAR
   ========================================================= */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
const esc = escapeHtml;

function deColorStyle(hex){ return hex ? 'color:'+hex+';' : ''; }
function hexToRgbA(hex, alpha){
  if(!hex) return 'rgba(0,0,0,0)';
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function wordChipHtml(w){
  const hex = wordColorHex(w.color);
  if(!hex) return '';
  const name = (WORD_COLORS.find(c=>c.key===w.color)||{}).name || '';
  return `<span class="color-chip" style="background:${hex};">${esc(name)}</span>`;
}
function colorFilterLabel(cf){
  if(!cf) return '';
  return cf==='none' ? 'Renksiz' : ((WORD_COLORS.find(c=>c.key===cf)||{}).name || '');
}
function sentList(w){ return (w && Array.isArray(w.sentences)) ? w.sentences.filter(sc=>sc && (sc.de||sc.tr)) : []; }
function hasExample(w){ return sentList(w).length>0; }
function exampleOf(w, rep){ const l = sentList(w); return l.length ? l[(rep||0) % l.length] : null; }
function exampleSelButtonHtml(w){
  if(!hasExample(w)) return '';
  return EXAMPLE_SELECTED.has(w.id)
    ? `<button class="reset-btn" data-unselexample="${w.id}" style="border-color:var(--green);color:var(--green);font-weight:700;" title="Cümleli çalışmadan çıkar">✓ seçili</button>`
    : `<button class="reset-btn" data-selexample="${w.id}" title="Cümleli çalışmaya ekle">📝 çalış</button>`;
}
function exampleDisplayHtml(w, size, rep){
  const ex = exampleOf(w, rep);
  if(!ex) return '';
  const cls = 'word-example' + (size ? ' '+size : '');
  const wHex = wordColorHex(w.color);
  const borderColor = wHex || 'var(--amber)';
  const deStyle = wHex ? `color:${wHex};font-weight:600;` : '';
  return `<div class="${cls}" style="border-left-color:${borderColor};">
    ${ex.de ? `<div class="we-de" style="${deStyle}">${esc(ex.de)}</div>` : ''}
    ${ex.tr ? `<div class="we-tr">${esc(ex.tr)}</div>` : ''}
  </div>`;
}

function newModuleId(){ return 'm'+Date.now()+Math.floor(Math.random()*10000); }
function newSubModuleId(){ return 'sm'+Date.now()+Math.floor(Math.random()*10000); }
let WORD_ID_COUNTER = 0;
function newWordId(){ WORD_ID_COUNTER++; return 'w'+Date.now()+'_'+WORD_ID_COUNTER+'_'+Math.floor(Math.random()*10000); }
let SENTENCE_ID_COUNTER = 0;
function newSentenceId(){ SENTENCE_ID_COUNTER++; return 'sc'+Date.now()+'_'+SENTENCE_ID_COUNTER+'_'+Math.floor(Math.random()*10000); }

const STAGE_TYPES = ['HÖM','TAHMİN','TERS','EŞLEŞTİRME','TAHMİN','TERS','EŞLEŞTİRME','TAHMİN','TERS','MİNİ TEST'];
const EXAMPLE_STAGE_TYPES = ['TAHMİN','CÜMLE','EŞLEŞTİRME'];
const SENTENCE_STAGE_TYPES = ['HÖM','TAHMİN','TERS','MİNİ TEST'];
const REPS = 14;
const STEPS_PER_MODULE = STAGE_TYPES.length * REPS;
const EXAMPLE_STEPS_PER_MODULE = EXAMPLE_STAGE_TYPES.length * REPS;
const SENTENCE_STEPS_PER_MODULE = SENTENCE_STAGE_TYPES.length * REPS;

function repsDone(prog){ return Math.floor(prog.step / STAGE_TYPES.length); }
function progLabel(prog){ return repsDone(prog)+'/'+REPS; }
function progPct(prog){ return Math.round((repsDone(prog)/REPS)*100); }
function exampleProgLabel(step){ return Math.floor(step / EXAMPLE_STAGE_TYPES.length)+'/'+REPS; }
function exampleProgPct(step){ return Math.round((Math.floor(step / EXAMPLE_STAGE_TYPES.length)/REPS)*100); }
function sentenceProgLabel(step){ return Math.floor(step / SENTENCE_STAGE_TYPES.length)+'/'+REPS; }
function sentenceProgPct(step){ return Math.round((Math.floor(step / SENTENCE_STAGE_TYPES.length)/REPS)*100); }

function seededRandom(seed){
  let a = (seed>>>0) || 1;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rnd = seededRandom(seed+1);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function normalizeTr(str){
  return (str||'').toLocaleLowerCase('tr').replace(/-/g,' ').replace(/[().,;:!?'"]/g,'').replace(/\s+/g,' ').trim();
}
function normalizeDe(str){
  return (str||'').toLocaleLowerCase('de').trim();
}
function isCorrectTr(input, acceptedList){
  const n = normalizeTr(input);
  if(!n) return false;
  return acceptedList.some(a => normalizeTr(a)===n);
}
function looseTrMatch(a, b){
  const na = normalizeTr(a); const nb = normalizeTr(b);
  if(!na || !nb) return false;
  if(na === nb) return true;
  if(na.length >= 4 && nb.length >= 4){
    if(na.includes(nb) || nb.includes(na)) return true;
  }
  return false;
}
function looseDeMatch(a, b){
  const na = normalizeDe(a); const nb = normalizeDe(b);
  if(!na || !nb) return false;
  if(na === nb) return true;
  if(na.length >= 4 && nb.length >= 4){
    if(na.includes(nb) || nb.includes(na)) return true;
  }
  return false;
}

/* =========================================================
   VERİ DEPOLAMA
   ========================================================= */
const memFallback = {};
let _hasLS = null;
function hasClaudeStorage(){ return typeof window!=='undefined' && !!window.storage; }
function hasLocalStorage(){
  if(_hasLS!==null) return _hasLS;
  try{
    if(typeof window==='undefined' || !window.localStorage) return _hasLS=false;
    const t='__osd_test__'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t);
    return _hasLS = true;
  }catch(e){ return _hasLS = false; }
}
async function storeGet(key){
  try{
    if(hasClaudeStorage()){
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }
  }catch(e){}
  try{
    if(hasLocalStorage()){
      const v = window.localStorage.getItem('osd:'+key);
      return v ? JSON.parse(v) : null;
    }
  }catch(e){}
  return memFallback[key] !== undefined ? memFallback[key] : null;
}
async function storeSet(key, value){
  memFallback[key] = value;
  try{
    if(hasClaudeStorage()){ await window.storage.set(key, JSON.stringify(value), false); return; }
  }catch(e){}
  try{
    if(hasLocalStorage()){ window.localStorage.setItem('osd:'+key, JSON.stringify(value)); return; }
  }catch(e){}
}
async function storeDelete(key){
  delete memFallback[key];
  try{ if(hasClaudeStorage()) await window.storage.delete(key, false); }catch(e){}
  try{ if(hasLocalStorage()) window.localStorage.removeItem('osd:'+key); }catch(e){}
}

/* =========================================================
   UYGULAMA DURUMU
   ========================================================= */
let MODULES = [];
let PROGRESS = {};
let SCREEN = 'loading';
let CUR_MODULE = 0;
let EDIT_MODULE = 0;
let RENAME_IDX = null;
let RENAME_SUB_ID = null;
let EDIT_WORD_ID = null;
let EDIT_WORD_COLOR = null;
let EDIT_EXAMPLE_WORD_ID = null;
let BULK_ADD_OPEN = false;
let BULK_SENTENCE_ADD_OPEN = false;
let CUR_SUBMODULE = null;
let session = null;
let activeTimer = null;
let LAST_REP = 0;

let NEW_WORD_COLOR = null;
let QUICK_COLOR_ID = null;
let SUB_OPEN_IDS = new Set();
let NEW_WORD_OPEN = false;
let SUB_ADD_OPEN = null;
let COLOR_FILTER = null;

const COLOR_FILTER_BULK = {};
let SELECTED_BULK_WORDS = new Set();
let SEL_BULK_SUBID = null;
let BULK_PENDING_COLOR = {};
let MAIN_PENDING_COLOR = undefined;
let SELECTED_WORDS = new Set();
let EXAMPLE_SELECTED = new Set();

  {key:'green',  name:'Yeşil',   hex:'#3F9142'},
  {key:'blue',   name:'Mavi',    hex:'#3B6FB6'},
  {key:'red',    name:'Kırmızı', hex:'#C2403F'},

function colorPickerHtml(scope, current){
  const none = `<button type="button" class="color-dot none ${!current?'active':''}" data-colorpick="${scope}" data-color="" title="Renksiz"></button>`;
  return `<div class="color-picker">${none}${WORD_COLORS.map(c=>`<button type="button" class="color-dot ${current===c.key?'active':''}" style="--cdot:${c.hex};" data-colorpick="${scope}" data-color="${c.key}" title="${c.name}"></button>`).join('')}</div>`;
}

function subIsBulk(sub){ return !!(sub && sub.kind==='bulk'); }
function subIsSentence(sub){ return !!(sub && sub.kind==='sentence'); }

function mainWords(m){
  return m.words.filter(w=> w.origin !== 'bulk');
}

function selectedExampleIdsInSub(m, sub){
  if(!sub) return [];
  return (sub.wordIds||[]).filter(id=>{
    if(!EXAMPLE_SELECTED.has(id)) return false;
    const w = m.words.find(x=>x.id===id);
    return !!(w && hasExample(w));
  });
}

function normalizeLoadedData(){
  MODULES.forEach(m=>{
    if(!PROGRESS[m.id]) PROGRESS[m.id] = {step:0, done:false};
    if(typeof m.name !== 'string') m.name = '';
    if(!Array.isArray(m.subModules)) m.subModules = [];
    if(!Array.isArray(m.words)) m.words = [];
    m.words.forEach(w=>{
      if(typeof w.errors !== 'number') w.errors = 0;
      if(!WORD_COLORS.some(c=>c.key===w.color)) w.color = null;
      if(!w.id) w.id = newWordId();
      if(!Array.isArray(w.tr)) w.tr = w.tr ? [String(w.tr)] : [];
      if(!Array.isArray(w.sentences)) w.sentences = [];
      if(w.example && typeof w.example === 'object' && (w.example.de || w.example.tr)){
        // eski tek örnek cümle -> cümle listesinin ilk elemanı
        w.sentences.unshift({ id:newSentenceId(), de: String(w.example.de||''), tr: String(w.example.tr||''), color:null });
      }
      delete w.example;
      w.sentences = w.sentences.filter(sc => sc && typeof sc === 'object').map(sc=>({
        id: sc.id || newSentenceId(),
        de: typeof sc.de === 'string' ? sc.de : '',
        tr: typeof sc.tr === 'string' ? sc.tr : '',
        color: WORD_COLORS.some(c=>c.key===sc.color) ? sc.color : null
      }));
      if(!w.sentProgress || typeof w.sentProgress !== 'object') w.sentProgress = { step: 0 };
      if(typeof w.sentProgress.step !== 'number') w.sentProgress.step = 0;
    });
    m.words.forEach(w=>{
      if(typeof w.origin !== 'string'){
        const inBulk = (m.subModules||[]).some(s=>subIsBulk(s)&&(s.wordIds||[]).includes(w.id));
        w.origin = inBulk ? 'bulk' : 'manual';
      }
    });
    m.subModules.forEach(sub=>{
      if(sub.kind === 'sentence'){
        if(!Array.isArray(sub.sentences)) sub.sentences = [];
        if(!sub.progress || typeof sub.progress !== 'object') sub.progress = { step: 0 };
        if(typeof sub.progress.step !== 'number') sub.progress.step = 0;
        sub.sentences.forEach(sc=>{
          if(!sc.id) sc.id = newSentenceId();
          if(typeof sc.de !== 'string') sc.de = '';
          if(typeof sc.tr !== 'string') sc.tr = '';
          if(!WORD_COLORS.some(c=>c.key===sc.color)) sc.color = null;
        });
        delete sub.wordIds;
        return;
      }
      if(!Array.isArray(sub.wordIds)){
        const oldDeList = Array.isArray(sub.wordDe) ? sub.wordDe : [];
        sub.wordIds = m.words.filter(w=>oldDeList.includes(w.de)).map(w=>w.id);
      }
      delete sub.wordDe;
      sub.wordIds = (sub.wordIds||[]).filter(id => m.words.some(w=>w.id===id));
    });
  });
}

async function loadProgress(){
  const saved = await storeGet('osd_data_v2');
  if(saved && Array.isArray(saved.modules)){
    MODULES = saved.modules;
    PROGRESS = saved.progress || {};
  } else {
    MODULES = [];
    PROGRESS = {};
  }
  normalizeLoadedData();
}

let LINKED_WRITE_CHAIN = Promise.resolve();
async function saveProgress(){
  await storeSet('osd_data_v2', {modules:MODULES, progress:PROGRESS});
  LINKED_WRITE_CHAIN = LINKED_WRITE_CHAIN.then(()=>writeToLinkedFile()).catch(()=>{});
}

function fsApiSupported(){ return typeof window!=='undefined' && !!window.showSaveFilePicker; }
let LINKED_HANDLE = null;
let RECONNECT_HANDLE_PENDING = null;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('no idb')); return; }
    const req = indexedDB.open('osd_fs_link', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction('kv','readonly');
      const r = tx.objectStore('kv').get(key);
      r.onsuccess = ()=> resolve(r.result || null);
      r.onerror = ()=> reject(r.error);
    });
  }catch(e){ return null; }
}
async function idbSet(key, value){
  try{
    const db = await idbOpen();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction('kv','readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){}
}

async function connectLocalFile(){
  if(!fsApiSupported()){
    alert('Bu özellik yalnızca Chrome, Edge veya Opera tarayıcısında çalışır.');
    return;
  }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'osd_veritabani.json',
      types: [{ description:'JSON veritabanı', accept:{'application/json':['.json']} }]
    });
    LINKED_HANDLE = handle;
    await idbSet('fileHandle', handle);
    let fileHadData = false;
    try{
      const f = await handle.getFile();
      const t = await f.text();
      if(t && t.trim()){
        const d = JSON.parse(t);
        if(d && Array.isArray(d.modules) && d.modules.length>0) fileHadData = true;
      }
    }catch(e){}
    if(fileHadData){
      if(MODULES.length===0){
        await maybeRestoreFromLinkedFile();
        alert('Bağlandı ve dosyadaki veriler geri yüklendi.');
      } else {
        const useFile = confirm('Seçilen dosyada kayıtlı veri var. "Tamam" = dosyadaki veriyi kullan, "İptal" = tarayıcıdaki veriyi dosyaya yaz.');
        if(useFile){
          await maybeRestoreFromLinkedFile(true);
          alert('Dosyadaki veri yüklendi.');
        } else {
          await writeToLinkedFile();
          alert('Tarayıcıdaki veri dosyaya yazıldı.');
        }
      }
    } else {
      await writeToLinkedFile();
      alert('Bağlandı! Bundan sonra her değişiklik otomatik olarak bu dosyaya da yazılacak.');
    }
    render();
  }catch(e){}
}

async function writeToLinkedFile(){
  if(!LINKED_HANDLE) return;
  try{
    const perm = await LINKED_HANDLE.queryPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const payload = { app:'osd-almanca-kelime', version:3, savedAt:new Date().toISOString(), modules:MODULES, progress:PROGRESS };
    const writable = await LINKED_HANDLE.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
  }catch(e){}
}

async function tryReconnectLinkedFile(){
  if(!fsApiSupported()) return;
  const handle = await idbGet('fileHandle');
  if(!handle) return;
  try{
    let perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'prompt'){ RECONNECT_HANDLE_PENDING = handle; return; }
    if(perm !== 'granted') return;
    LINKED_HANDLE = handle;
    await maybeRestoreFromLinkedFile();
  }catch(e){}
}

async function maybeRestoreFromLinkedFile(force){
  if(!LINKED_HANDLE) return;
  try{
    const file = await LINKED_HANDLE.getFile();
    const text = await file.text();
    if(!text || !text.trim()) return;
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.modules)) return;
    if(force || (MODULES.length===0 && data.modules.length>0)){
      MODULES = data.modules;
      PROGRESS = data.progress || {};
      normalizeLoadedData();
      await storeSet('osd_data_v2', {modules:MODULES, progress:PROGRESS});
    }
  }catch(e){}
}

async function confirmReconnect(){
  const handle = RECONNECT_HANDLE_PENDING;
  if(!handle) return;
  try{
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){
      LINKED_HANDLE = handle;
      RECONNECT_HANDLE_PENDING = null;
      await maybeRestoreFromLinkedFile();
      render();
    } else {
      alert('İzin verilmedi.');
    }
  }catch(e){ alert('Dosya bağlantısı kurulamadı.'); }
}

function exportAllDataAsJson(){
  if(MODULES.length===0){ alert('Yedeklenecek herhangi bir modül yok.'); return; }
  const payload = { app:'osd-almanca-kelime', version:3, exportedAt:new Date().toISOString(), modules:MODULES, progress:PROGRESS };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const dateStr = new Date().toISOString().slice(0,10);
  a.download = 'osd_yedek_'+dateStr+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function importAllDataFromFile(file){
  if(!file) return;
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(e){ alert('Geçerli bir yedek dosyası değil.'); return; }
  if(!data || !Array.isArray(data.modules)){ alert('Geçerli bir yedek dosyası değil.'); return; }
  if(!confirm('Bu yedek, cihazdaki MEVCUT tüm modülleri DEĞİŞTİRECEK. Devam edilsin mi?')) return;
  MODULES = data.modules;
  PROGRESS = data.progress || {};
  normalizeLoadedData();
  await saveProgress();
  SCREEN = 'list';
  render();
  alert('Yedek yüklendi: '+MODULES.length+' modül.');
}

function moduleLabel(m, idx){
  return (m && m.name && m.name.trim()) ? m.name.trim() : ('Modül '+(idx+1));
}

function subModuleLabel(sub, i, mod){
  if(sub && sub.name && sub.name.trim()) return sub.name.trim();
  if(sub && sub.kind === 'sentence'){
    let n = i;
    if(mod && Array.isArray(mod.subModules)) n = mod.subModules.filter(x => x.kind === 'sentence').indexOf(sub);
    return 'Cümle Grubu ' + (n+1);
  }
  let n = i;
  if(mod && Array.isArray(mod.subModules)) n = mod.subModules.filter(x => subIsBulk(x) === subIsBulk(sub) && x.kind !== 'sentence').indexOf(sub);
  return (subIsBulk(sub) ? 'Toplu Grup ' : 'Tekrar Modülü ') + (n+1);
}

async function addWordToModule(idx, de, trRaw){
  const m = MODULES[idx];
  if(!m) return;
  de = (de||'').trim();
  const tr = (trRaw||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!de || tr.length===0){ alert('Lütfen hem Almanca hem Türkçe alanını doldur.'); return; }
  m.words.push({id:newWordId(), de, tr, errors:0, color:NEW_WORD_COLOR, origin:'manual', sentences:[], sentProgress:{step:0}});
  await saveProgress();
  render();
}

function parseBulkLine(line, origin){
  line = line.trim();
  if(!line) return null;
  let sepIdx = -1;
  const tabIdx = line.indexOf('\t');
  if(tabIdx !== -1){ sepIdx = tabIdx; }
  else {
    const colonIdx = line.indexOf(':');
    if(colonIdx !== -1){ sepIdx = colonIdx; }
  }
  if(sepIdx === -1) return null;
  const de = line.slice(0, sepIdx).trim();
  const trRaw = line.slice(sepIdx+1).trim();
  const tr = trRaw.split(',').map(s=>s.trim()).filter(Boolean);
  if(!de || tr.length===0) return null;
  return {id:newWordId(), de, tr, errors:0, color:NEW_WORD_COLOR, origin: origin || 'bulk', sentences:[], sentProgress:{step:0}};
}

async function bulkAddWordsToModule(idx, text, asMain){
  const m = MODULES[idx];
  if(!m) return;
  const origin = asMain ? 'manual' : 'bulk';
  const lines = (text||'').split('\n');
  let added = 0, skipped = 0;
  const addedWords = [];
  lines.forEach(line=>{
    if(!line.trim()) return;
    const w = parseBulkLine(line, origin);
    if(w){ m.words.push(w); addedWords.push(w); added++; } else { skipped++; }
  });
  if(!asMain && added>0){
    if(!Array.isArray(m.subModules)) m.subModules = [];
    const grp = { id:newSubModuleId(), name:'', kind:'bulk', wordIds: addedWords.map(w=>w.id) };
    m.subModules.push(grp);
    SUB_OPEN_IDS.add(grp.id);
  }
  if(added===0){ alert('Geçerli satır bulunamadı.'); return; }
  await saveProgress();
  render();
  const target = asMain ? 'ana modüle' : 'toplu gruba';
  alert(added+' kelime '+target+' eklendi.'+(skipped>0 ? ' ('+skipped+' satır atlandı.)' : ''));
}

function parseSentenceLine(line){
  line = line.trim();
  if(!line) return null;
  const sepIdx = line.indexOf(':');
  if(sepIdx === -1) return null;
  const de = line.slice(0, sepIdx).trim();
  const tr = line.slice(sepIdx+1).trim();
  if(!de || !tr) return null;
  return { id: newSentenceId(), de, tr, color: SENTENCE_PENDING_COLOR };
}
async function bulkAddSentencesToModule(idx, text){
  const m = MODULES[idx];
  if(!m) return;
  const lines = (text||'').split('\n');
  const added = [];
  lines.forEach(line=>{
    const sc = parseSentenceLine(line);
    if(sc) added.push(sc);
  });
  if(added.length === 0){
    alert('Geçerli satır bulunamadı. Her satıra "almanca cümle : türkçe çeviri" biçiminde yaz.');
    return;
  }
  if(!Array.isArray(m.subModules)) m.subModules = [];
  const grp = {
    id: newSubModuleId(),
    name: '',
    kind: 'sentence',
    progress: { step: 0 },
    sentences: added
  };
  m.subModules.push(grp);
  SUB_OPEN_IDS.add(grp.id);
  await saveProgress();
  render();
  alert(added.length + ' cümle yeni cümle grubuna eklendi.');
}
// Cümle sahibi: ya bir cümle grubu (subModules) ya da bir kelime ('w:<kelimeId>')
function sentOwner(m, id){
  if(typeof id === 'string' && id.indexOf('w:') === 0){
    const w = m.words.find(x=>'w:'+x.id === id);
    if(!w) return null;
    if(!Array.isArray(w.sentences)) w.sentences = [];
    if(!w.sentProgress || typeof w.sentProgress !== 'object') w.sentProgress = { step: 0 };
    return { id, kind:'sentence', _word:w, name:w.de, sentences:w.sentences, progress:w.sentProgress };
  }
  return (m.subModules||[]).find(s=>s.id===id) || null;
}
function sentCommit(o){ if(o && o._word){ o._word.sentences = o.sentences; o._word.sentProgress = o.progress; } }
let WORD_SENT_OPEN = new Set();   // cümle paneli açık kelimeler
let SENT_ADD_OPEN = new Set();    // 'cümle ekle' formu açık sahipler
async function addSentenceToOwner(idx, ownerId, de, tr){
  const m = MODULES[idx];
  const o = m && sentOwner(m, ownerId);
  if(!o) return false;
  de = (de||'').trim(); tr = (tr||'').trim();
  if(!de || !tr){ alert('Lütfen hem Almanca cümleyi hem Türkçe çevirisini yaz.'); return false; }
  o.sentences.push({ id:newSentenceId(), de, tr, color:null });
  sentCommit(o);
  await saveProgress();
  render();
  return true;
}
async function updateSentenceInGroup(idx, subId, sentId, de, tr, color){
  const m = MODULES[idx];
  const sub = sentOwner(m, subId);
  if(!sub) return;
  const sc = (sub.sentences||[]).find(x=>x.id===sentId);
  if(!sc) return;
  if(de !== undefined && de !== null) sc.de = String(de).trim();
  if(tr !== undefined && tr !== null) sc.tr = String(tr).trim();
  if(color !== undefined) sc.color = color;
  sentCommit(sub);
  await saveProgress();
  render();
}
async function removeSentenceFromGroup(idx, subId, sentId){
  const m = MODULES[idx];
  const sub = sentOwner(m, subId);
  if(!sub) return;
  sub.sentences = (sub.sentences||[]).filter(x=>x.id!==sentId);
  sentCommit(sub);
  SELECTED_SENTENCES.delete(sentId);
  if((sub.sentences||[]).length === 0 && !sub._word){ await deleteSubModule(idx, subId, true); return; }
  await saveProgress();
  render();
}
function toggleSentenceSelection(subId, sentId){
  if(EDIT_SENTENCE_ID !== null){ EDIT_SENTENCE_ID = null; EDIT_SENTENCE_GROUP_ID = null; }
  if(SEL_SENT_SUBID !== subId){
    SELECTED_SENTENCES.clear();
    SEL_SENT_SUBID = subId;
    delete SENT_PENDING_COLOR_PER_GROUP[subId];
  }
  if(SELECTED_SENTENCES.has(sentId)) SELECTED_SENTENCES.delete(sentId);
  else SELECTED_SENTENCES.add(sentId);
  render();
}
async function assignColorToSentenceSelection(idx, subId, color){
  const m = MODULES[idx];
  const sub = sentOwner(m, subId);
  if(!sub) return;
  (sub.sentences||[]).forEach(sc=>{
    if(SELECTED_SENTENCES.has(sc.id)) sc.color = color;
  });
  sentCommit(sub);
  await saveProgress();
  render();
}

function wordsToBulkText(words){
  return words.map(w => w.de + '\t' + w.tr.join(', ')).join('\n');
}
function fileNameForModule(m, idx){
  const label = moduleLabel(m, idx) || ('Modul_'+(idx+1));
  const safe = label.replace(/[^\p{L}\p{N}_\- ]+/gu,'').trim().replace(/\s+/g,'_');
  return (safe || 'modul') + '_kelimeler.txt';
}
function downloadModuleWordsAsTxt(idx){
  const m = MODULES[idx];
  const words = mainWords(m);
  if(!m || words.length===0){ alert('İndirilecek kelime yok.'); return; }
  const text = wordsToBulkText(words);
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileNameForModule(m, idx);
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function downloadBulkGroupAsTxt(idx, subId){
  const m = MODULES[idx];
  const sub = m && (m.subModules||[]).find(s=>s.id===subId);
  if(!sub){ return; }
  const words = (sub.wordIds||[]).map(id=>m.words.find(w=>w.id===id)).filter(Boolean);
  if(words.length===0){ alert('İndirilecek kelime yok.'); return; }
  const blob = new Blob([wordsToBulkText(words)], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const label = subModuleLabel(sub, (m.subModules||[]).indexOf(sub), m);
  const safe = label.replace(/[^\p{L}\p{N}_\- ]+/gu,'').trim().replace(/\s+/g,'_');
  a.href = url;
  a.download = (safe || 'toplu_grup') + '_kelimeler.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function removeWordFromModule(idx, wordId){
  const m = MODULES[idx];
  if(!m) return;
  m.words = m.words.filter(w=>w.id!==wordId);
  (m.subModules||[]).forEach(sub=>{
    if(sub.kind === 'sentence') return;
    sub.wordIds = (sub.wordIds||[]).filter(id=>id!==wordId);
  });
  m.subModules = (m.subModules||[]).filter(sub => subIsSentence(sub) ? ((sub.sentences||[]).length>0) : ((sub.wordIds||[]).length > 0));
  SELECTED_WORDS.delete(wordId);
  SELECTED_BULK_WORDS.delete(wordId);
  EXAMPLE_SELECTED.delete(wordId);
  if(EDIT_EXAMPLE_WORD_ID === wordId) EDIT_EXAMPLE_WORD_ID = null;
  await saveProgress();
  render();
}

async function updateWordInModule(idx, wordId, de, trRaw){
  const m = MODULES[idx];
  const w = m && m.words.find(x=>x.id===wordId);
  if(!w) return;
  de = (de||'').trim();
  const tr = (trRaw||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!de || tr.length===0){ alert('Lütfen hem Almanca hem Türkçe alanını doldur.'); return; }
  w.de = de;
  w.tr = tr;
  w.color = EDIT_WORD_COLOR;
  await saveProgress();
  EDIT_WORD_ID = null;
  render();
}

function clearSelection(){

function toggleBulkSelection(subId, wordId){
  if(EDIT_EXAMPLE_WORD_ID !== null) EDIT_EXAMPLE_WORD_ID = null;
  if(SEL_BULK_SUBID !== subId){
    SELECTED_BULK_WORDS.clear();
    SEL_BULK_SUBID = subId;
    delete BULK_PENDING_COLOR[subId];
  }
  if(SELECTED_BULK_WORDS.has(wordId)) SELECTED_BULK_WORDS.delete(wordId);
  else SELECTED_BULK_WORDS.add(wordId);
  render();
}
function clearBulkSelection(subId){
  if(SEL_BULK_SUBID === subId){
    SELECTED_BULK_WORDS.clear();
    SEL_BULK_SUBID = null;
    delete BULK_PENDING_COLOR[subId];
  }
  render();
}
function selectAllBulkWords(subId){
  const m = MODULES[EDIT_MODULE];
  const sub = (m.subModules||[]).find(s=>s.id===subId);
  if(!sub) return;
  if(SEL_BULK_SUBID !== subId){ SELECTED_BULK_WORDS.clear(); SEL_BULK_SUBID = subId; }
  const filter = COLOR_FILTER_BULK[subId] || null;
  (sub.wordIds||[]).forEach(id=>{
    const w = m.words.find(x=>x.id===id);
    if(!w) return;
    if(filter){
      if(filter==='none' && w.color) return;
      if(filter!=='none' && w.color!==filter) return;
    }
    SELECTED_BULK_WORDS.add(id);
  });
  render();
}
async function assignColorToBulkSelection(subId, color){
  const m = MODULES[EDIT_MODULE];
  const sub = (m.subModules||[]).find(s=>s.id===subId);
  if(!sub) return;
  (sub.wordIds||[]).forEach(id=>{
    if(SELECTED_BULK_WORDS.has(id)){
      const w = m.words.find(x=>x.id===id);
      if(w) w.color = color;
    }
  });
  await saveProgress();
  render();
}
async function assignColorToMainSelection(color){
  const m = MODULES[EDIT_MODULE];
  if(!m) return;
  m.words.forEach(w=>{
    if(SELECTED_WORDS.has(w.id)) w.color = color;
  });
  await saveProgress();
  render();
}

async function createSubModuleFromSelection(idx){
  const m = MODULES[idx];
  if(!m || SELECTED_WORDS.size===0) return;
  if(!Array.isArray(m.subModules)) m.subModules = [];
  const sub = { id:newSubModuleId(), name:'', wordIds: Array.from(SELECTED_WORDS) };
  m.subModules.push(sub);
  SELECTED_WORDS.clear();
  MAIN_PENDING_COLOR = undefined;
  SUB_OPEN_IDS.add(sub.id);
  await saveProgress();
  render();
}
async function createRepeatFromBulkSelection(idx, subId){
  const m = MODULES[idx];
  if(!m || SEL_BULK_SUBID !== subId || SELECTED_BULK_WORDS.size===0) return;
  if(!Array.isArray(m.subModules)) m.subModules = [];
  const sub = { id:newSubModuleId(), name:'', wordIds: Array.from(SELECTED_BULK_WORDS) };
  m.subModules.push(sub);
  SELECTED_BULK_WORDS.clear();
  SEL_BULK_SUBID = null;
  delete BULK_PENDING_COLOR[subId];
  SUB_OPEN_IDS.add(sub.id);
  await saveProgress();
  render();
}
async function removeWordFromSubModule(idx, subId, wordId){
  const m = MODULES[idx];
  if(!m) return;
  const sub = (m.subModules||[]).find(s=>s.id===subId);
  if(!sub) return;
  sub.wordIds = (sub.wordIds||[]).filter(id=>id!==wordId);
  const w = m.words.find(x=>x.id===wordId);
  if(w && w.origin === 'bulk'){
    const stillInAnySub = (m.subModules||[]).some(s => s.id !== subId && (s.wordIds||[]).includes(wordId));
    if(!stillInAnySub){
      m.words = m.words.filter(x=>x.id!==wordId);
    } else {
      const stillInBulkGroup = (m.subModules||[]).some(s => s.id !== subId && subIsBulk(s) && (s.wordIds||[]).includes(wordId));
      if(!stillInBulkGroup){
        w.origin = 'manual';
      }
    }
  }
  if((sub.wordIds||[]).length === 0){ await deleteSubModule(idx, subId, true); return; }
  await saveProgress();
  render();
}
async function addExistingWordToSubModule(idx, subId, wordId){
  const m = MODULES[idx];
  if(!m) return;
  const sub = (m.subModules||[]).find(s=>s.id===subId);
  if(!sub || !m.words.some(w=>w.id===wordId)) return;
  if(!Array.isArray(sub.wordIds)) sub.wordIds = [];
  if(!sub.wordIds.includes(wordId)) sub.wordIds.push(wordId);
  await saveProgress();
  render();
}
async function deleteSubModule(idx, subId, silent){
  const m = MODULES[idx];
  if(!m) return;
  const sub = (m.subModules||[]).find(s=>s.id===subId);
  if(!silent && !confirm('"'+(sub&&sub.name?sub.name:'Bu grup')+'" silinsin mi?')) return;
  m.subModules = (m.subModules||[]).filter(s=>s.id!==subId);
  if(CUR_SUBMODULE===subId) CUR_SUBMODULE = null;
  if(SEL_BULK_SUBID===subId) { SELECTED_BULK_WORDS.clear(); SEL_BULK_SUBID=null; delete BULK_PENDING_COLOR[subId]; }
  if(SEL_SENT_SUBID===subId) { SELECTED_SENTENCES.clear(); SEL_SENT_SUBID=null; delete SENT_PENDING_COLOR_PER_GROUP[subId]; }
  if(SUB_ADD_OPEN===subId) SUB_ADD_OPEN = null;
  if(RENAME_SUB_ID===subId) RENAME_SUB_ID = null;
  const orphanBulkWordIds = m.words.filter(w=>w.origin==='bulk').filter(w=>{
    const inBulk = (m.subModules||[]).some(s=>subIsBulk(s)&&(s.wordIds||[]).includes(w.id));
    const inAnySub = (m.subModules||[]).some(s=>(s.wordIds||[]).includes(w.id));
    return !inBulk && !inAnySub;
  }).map(w=>w.id);
  if(orphanBulkWordIds.length>0){
    m.words = m.words.filter(w=>!orphanBulkWordIds.includes(w.id));
  }
  await saveProgress();
  render();
}
async function renameSubModule(idx, subId, newName){
  const m = MODULES[idx];
  const sub = (m.subModules||[]).find(s=>s.id===subId);
  if(!sub) return;
  sub.name = (newName||'').trim().slice(0,40);
  await saveProgress();
  RENAME_SUB_ID = null;
  render();
}

function toggleExampleSelection(wordId){

  if(EXAMPLE_SELECTED.has(wordId)) EXAMPLE_SELECTED.delete(wordId);
  else EXAMPLE_SELECTED.add(wordId);

}
function selectAllExampleWords(){

function startExampleLesson(){
  const m = MODULES[EDIT_MODULE];
  if(!m) return;
  const validIds = Array.from(EXAMPLE_SELECTED).filter(id => {
    const w = m.words.find(x=>x.id===id);
    return w && hasExample(w);
  });
  if(validIds.length === 0){
    alert('Seçili kelimelerde cümle yok. Önce cümle ekleyin veya farklı kelimeler seçin.');
    return;
  }
  CUR_MODULE = EDIT_MODULE;
  startStep(null, null, validIds);
}

const root = document.getElementById('app');

function render(){
  clearActiveTimer();
  clearKeyHandler();
  if(SCREEN==='loading'){ root.innerHTML = '<div class="empty-note">Yükleniyor...</div>'; return; }
  if(SCREEN==='list'){ root.innerHTML = renderList(); attachListEvents(); return; }
  if(SCREEN==='edit'){ root.innerHTML = renderEdit(); attachEditEvents(); return; }

function attachListEvents(){
  const reset = document.getElementById('resetBtn');
  if(reset) reset.onclick = async ()=>{
    if(confirm('Tüm ilerleme sıfırlansın mı? (Kelimeler kalır)')){
      PROGRESS = defaultProgress();
      await saveProgress();
      render();
    }
  };
  const exportBtn = document.getElementById('exportAllBtn');
  if(exportBtn) exportBtn.onclick = exportAllDataAsJson;
  const importBtn = document.getElementById('importAllBtn');
  const importInput = document.getElementById('importFileInput');
  if(importBtn && importInput) importBtn.onclick = ()=> importInput.click();
  if(importInput) importInput.onchange = (e)=>{
    const file = e.target.files && e.target.files[0];
    importAllDataFromFile(file);
    importInput.value = '';
  };
  const installBtn = document.getElementById('installAppBtn');
  if(installBtn) installBtn.onclick = installApp;
  const connectBtn = document.getElementById('connectFileBtn');
  if(connectBtn) connectBtn.onclick = connectLocalFile;
  const confirmReconnectBtn = document.getElementById('confirmReconnectBtn');
  if(confirmReconnectBtn) confirmReconnectBtn.onclick = confirmReconnect;
  const addBtn = document.getElementById('addModBtn');
  if(addBtn) addBtn.onclick = addModule;
  document.querySelectorAll('[data-start]').forEach(el=>{
    el.onclick = ()=>{
      CUR_MODULE = parseInt(el.dataset.start,10);
      RENAME_IDX = null;
      startStep();
    };
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = ()=>{
      EDIT_MODULE = parseInt(el.dataset.edit,10);
      COLOR_FILTER = null;
      RENAME_IDX = null;
      SELECTED_WORDS.clear();
      SELECTED_BULK_WORDS.clear();
      EXAMPLE_SELECTED.clear();
      SELECTED_SENTENCES.clear();
      SEL_SENT_SUBID = null;
      SENT_PENDING_COLOR_PER_GROUP = {};
      SENTENCE_COLOR_FILTER = {};
      SEL_BULK_SUBID = null;
      BULK_PENDING_COLOR = {};
      MAIN_PENDING_COLOR = undefined;
      EDIT_WORD_ID = null;
      EDIT_EXAMPLE_WORD_ID = null;
      EDIT_SENTENCE_ID = null;
      EDIT_SENTENCE_GROUP_ID = null;
      BULK_ADD_OPEN = false;
      BULK_SENTENCE_ADD_OPEN = false;
      SENTENCE_PENDING_COLOR = null;
      QUICK_SENT_COLOR_ID = null;
      NEW_WORD_OPEN = false;
      NEW_WORD_COLOR = null;
      SUB_ADD_OPEN = null;
      SCREEN = 'edit';
      render();
    };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deleteModule(parseInt(el.dataset.del,10)); };
  });
  document.querySelectorAll('[data-rename]').forEach(el=>{
    el.onclick = ()=>{ RENAME_IDX = parseInt(el.dataset.rename,10); render(); };
  });
  document.querySelectorAll('[data-rename-cancel]').forEach(el=>{
    el.onclick = ()=>{ RENAME_IDX = null; render(); };
  });
  document.querySelectorAll('[data-rename-save]').forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.dataset.renameSave,10);
      const inp = document.getElementById('renameInput');
      renameModule(idx, inp ? inp.value : '');
    };
  });
  const renameInput = document.getElementById('renameInput');
  if(renameInput){
    renameInput.focus(); renameInput.select();
    renameInput.onkeydown = (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); renameModule(RENAME_IDX, renameInput.value); }
      if(e.key==='Escape'){ e.preventDefault(); RENAME_IDX=null; render(); }
    };
  }
}

      <div class="hint" style="margin-bottom:8px;">Cümleli mod <strong>kelime de→tr · cümle çevirisi · eşleştirme</strong> alıştırmalarıyla çalışır.</div>

      </div>
    </div>`;
  }

  const controlsHtml = visibleMainWords.length>0 ? `
  <div class="btn-row" style="justify-content:flex-start;margin-bottom:14px;">
    <button class="reset-btn" id="selectAllBtn">Tümünü Seç</button>

  </div>
  ${mainSelectionPanel}` : '';

  const subs = m.subModules || [];
  let subsSection = '';
  if(subs.length>0){
    const repeatCards = [], bulkCards = [], sentenceCards = [];
    subs.forEach((sub,i)=>{
      if(sub.kind === 'sentence'){
        const label = subModuleLabel(sub, i, m);
        const cnt = (sub.sentences||[]).length;
        if(!SUB_OPEN_IDS.has(sub.id)){
          sentenceCards.push(`
          <div class="btn-row" style="justify-content:flex-start;margin-bottom:10px;">
            <button class="btn btn-ghost" data-subopen="${sub.id}">${esc(label)} ▼</button>

          return;
        }
        sentenceCards.push(renderSentenceGroupCard(m, sub, i));
        return;
      }
      const bulk = subIsBulk(sub);
      const icon = bulk ? '📦' : '🔁';
      const label = subModuleLabel(sub,i,m);
      const wordCount = (sub.wordIds||[]).filter(id => m.words.some(w=>w.id===id)).length;
      if(!SUB_OPEN_IDS.has(sub.id)){
        const toggleText = bulk ? `${esc(label)} ▼` : `${icon} ${esc(label)} ▼ (${wordCount})`;
        (bulk?bulkCards:repeatCards).push(`
      <div class="btn-row" style="justify-content:flex-start;margin-bottom:10px;">
        <button class="btn btn-ghost" data-subopen="${sub.id}">${toggleText}</button>
      </div>`); return; }
      if(bulk){
        bulkCards.push(renderBulkGroupCard(m, sub, i, prog, wordCount));
      } else {
        repeatCards.push(renderRepeatGroupCard(m, sub, i, prog, wordCount));
      }
    });
    subsSection = '';
    if(sentenceCards.length>0) subsSection += `
    <div style="margin-top:26px;">
      <span class="eyebrow">Cümle Grupları</span>
      <p class="hint" style="margin:4px 0 12px;">Toplu cümleler bu gruplarda. Her grup kendi ders döngüsüne sahiptir (HÖM · TAHMİN · TERS · MİNİ TEST).</p>
      ${sentenceCards.join('')}
    </div>`;
    if(bulkCards.length>0) subsSection += `
    <div style="margin-top:26px;">
      <span class="eyebrow">Toplu Eklenen Gruplar</span>
      <p class="hint" style="margin:4px 0 12px;">Bu kelimeler ana modülde görünmez, sadece bu grupta listelenir.</p>
      ${bulkCards.join('')}
    </div>`;
    if(repeatCards.length>0) subsSection += `
    <div style="margin-top:26px;">
      <span class="eyebrow">Tekrar Modülleri</span>
      <p class="hint" style="margin:4px 0 12px;">Ana listede görünmez; ilerlemesi ${esc(moduleLabel(m,EDIT_MODULE))} ile paylaşılır.</p>
      ${repeatCards.join('')}
    </div>`;
  }

  return `
  <div class="lesson-head">
    <div class="lesson-head-row">
      <span class="back-link" id="backBtn">← Modüller</span>
      <span class="stage-badge">${esc(moduleLabel(m,EDIT_MODULE))} · ${visibleMainWords.length} kelime</span>

    <h2 class="lesson-title" style="font-size:20px;">Kelimeleri düzenle</h2>
    <p class="hint" style="margin-top:6px;">Bir kelimeye uzun bas, seçili hale gelsin. Her kelimede "+ cümle ekle" ile istediğin kadar cümle ekleyip "▶ Derse başla" ile o cümlelerle çalışabilirsin.</p>
  </div>
  ${controlsHtml}
  ${exampleStudyPanel}
  ${filterHtml}
  ${mainFilterAction}
  <div>${rows}</div>
  <div style="margin-top:26px;">
    <span class="eyebrow">Kelime Ekleme</span>
    <p class="hint" style="margin:4px 0 12px;">Tek tek veya toplu ekleyebilirsin.</p>
  </div>
  ${NEW_WORD_OPEN ? `
  <div class="stage-card" style="align-items:stretch;text-align:left;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="hint">Yeni kelime ekle</span>

    <div class="input-row" style="max-width:none;">
      <input type="text" id="newDe" placeholder="Almanca (örn. kaufen)">
    </div>
    <div class="input-row" style="max-width:none;">
      <input type="text" id="newTr" placeholder="Türkçe anlam(lar), virgülle ayır">
    </div>
    <span class="hint">Renk grubu</span>
    ${colorPickerHtml('new', NEW_WORD_COLOR)}
    <div class="btn-row" style="justify-content:flex-start;">
      <button class="btn btn-primary" id="addWordBtn">+ Ekle</button>
    </div>
  </div>
  ` : `
  <div class="btn-row" style="justify-content:flex-start;margin-bottom:14px;">
    <button class="btn btn-ghost" id="newWordToggleBtn">+ Yeni kelime ekle ▼</button>
  </div>`}
  ${BULK_ADD_OPEN ? `
  <div class="stage-card" style="align-items:stretch;text-align:left;margin-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">

      <button class="reset-btn" id="bulkToggleBtn">Kapat ▲</button>
    </div>
    <textarea class="bulk-input" id="bulkInput" rows="6" placeholder="kaufen : satın almak
haben : sahip olmak
gehen : yaya gitmek, gitmek"></textarea>

    <div class="btn-row" style="justify-content:flex-start;">

    </div>

  ${BULK_SENTENCE_ADD_OPEN ? `

    ${colorPickerHtml('sent-new', SENTENCE_PENDING_COLOR)}

      <button class="btn btn-primary" id="bulkSentAddBtn">+ Toplu Cümle Ekle</button>

function renderBulkGroupCard(m, sub, subIdx, prog, wordCount){
  const allWords = (sub.wordIds||[]).map(id => m.words.find(w=>w.id===id)).filter(Boolean);
  const isActiveSel = SEL_BULK_SUBID === sub.id;
  const sel = isActiveSel ? SELECTED_BULK_WORDS : new Set();
  const selCount = sel.size;
  const filter = COLOR_FILTER_BULK[sub.id] || null;
  const filtered = filter
    ? allWords.filter(w => filter==='none' ? !w.color : w.color === filter)
    : allWords;

  const subExampleIds = selectedExampleIdsInSub(m, sub);
  const subExampleCount = subExampleIds.length;

  const filterHtml = allWords.length > 0 ? `
    <div class="color-picker" style="margin-bottom:10px;">
      <span class="hint" style="margin:0 2px 0 0;">Renk:</span>
      <button type="button" class="reset-btn" data-bulk-colorfilter="${sub.id}" data-cf="" style="${!filter?'border-color:var(--ink);':''}">Tümü</button>
      ${WORD_COLORS.map(c=>`<button type="button" class="color-dot ${filter===c.key?'active':''}" style="--cdot:${c.hex};" data-bulk-colorfilter="${sub.id}" data-cf="${c.key}" title="${c.name} (${allWords.filter(x=>x.color===c.key).length})"></button>`).join('')}
      <button type="button" class="color-dot none ${filter==='none'?'active':''}" data-bulk-colorfilter="${sub.id}" data-cf="none" title="Renksiz (${allWords.filter(x=>!x.color).length})"></button>
    </div>` : '';

  let bulkFilterAction = '';
  if(filter){
    const filteredCount = allWords.filter(w => filter==='none' ? !w.color : w.color===filter).length;
    if(filteredCount > 0){
      const flbl = colorFilterLabel(filter);
      bulkFilterAction = `
      <div class="btn-row" style="justify-content:flex-start;margin-top:8px;margin-bottom:6px;">
        <button class="btn btn-primary" data-substart-filtered="${sub.id}" style="padding:8px 14px;font-size:13px;">▶ Sadece ${esc(flbl)} ile Derse Başla (${filteredCount})</button>
      </div>`;
    }
  }

  const pendingColor = BULK_PENDING_COLOR[sub.id];
  const hasPending = pendingColor !== undefined;
  const pendingLabel = !hasPending ? null : (pendingColor === null ? 'Renksiz' : ((WORD_COLORS.find(c=>c.key===pendingColor)||{}).name || ''));

  const selectionPanel = (isActiveSel && selCount > 0) ? `
    <div class="example-block" style="margin-bottom:10px;border:1.5px solid var(--amber);background:var(--amber-tint);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong style="font-size:13px;">✓ ${selCount} kelime seçili</strong>
        <button class="reset-btn" data-bulk-clearsel="${sub.id}">Seçimi temizle</button>
      </div>
      <div class="hint" style="margin-bottom:6px;">Renk seç, sonra "Kaydet"e bas:</div>
      ${colorPickerHtml('bulksel-'+sub.id, pendingColor)}
      <div class="btn-row" style="justify-content:flex-start;margin-top:10px;">
        <button class="btn btn-primary" data-bulk-savecolor="${sub.id}" ${!hasPending?'disabled':''}>✓ Seçileni Kaydet${pendingLabel?' ('+pendingLabel+')':''}</button>
        <button class="btn btn-ghost" data-bulk-makerepeat="${sub.id}">+ Tekrar Modülü (${selCount})</button>
      </div>
    </div>` : '';

  const wordRows = filtered.length > 0 ? filtered.map(w=>{
    const isSel = sel.has(w.id);
    const wHex = wordColorHex(w.color);
    return `
      <div class="example-block wrow ${isSel?'word-selected':''}" data-bulk-word="${w.id}" data-bulk-sub="${sub.id}" style="margin-bottom:6px;cursor:pointer;user-select:none;${wHex?`box-shadow:inset 6px 0 0 ${wHex};`:''}">
        <div class="wrow-main">
          <span style="width:16px;color:var(--teal);font-weight:700;flex-shrink:0;">${isSel?'✓':''}</span>
          <div style="flex:1;min-width:0;">
            <div class="example-de" style="font-size:15px;${deColorStyle(wHex)}">${wHex?`<span class="color-mini" data-quickcolor="${w.id}" title="Rengi değiştir" style="--cdot:${wHex};cursor:pointer;width:14px;height:14px;"></span>`:''}${esc(w.de)}</div>
            <div class="example-tr">${esc(w.tr.join(' / '))}</div>
          </div>
        </div>
        <div class="wrow-side">
          <div class="wrow-btns">
            <button class="reset-btn" data-bulk-word-rm="${w.id}" data-bulk-sub="${sub.id}" style="padding:4px 8px;">− çıkar</button>
            ${wordSentButtonsHtml(w)}
          </div>
        </div>
      </div>
      ${wordSentPanelHtml(m, w)}
      ${QUICK_COLOR_ID===w.id ? `<div class="example-block" style="margin:-2px 0 6px;">${colorPickerHtml('quick', w.color||null)}</div>` : ''}`;
  }).join('') : `<p class="empty-note" style="padding:10px 0;">${filter?'Bu renkte kelime yok.':'Bu grupta kelime yok.'}</p>`;

  const avail = mainWords(m).filter(x=>!(sub.wordIds||[]).includes(x.id));
  let addFromMainSection = '';
  if(avail.length>0){
    if(SUB_ADD_OPEN!==sub.id){
      addFromMainSection = `<div class="btn-row" style="justify-content:flex-start;margin-top:10px;"><button class="btn btn-ghost" data-subadd-toggle="${sub.id}" style="padding:8px 14px;font-size:13px;">+ Ana modülden kelime ekle ▼</button></div>`;
    } else {
      addFromMainSection = `<div style="margin-top:12px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span class="hint">Eklemek istediğin kelimeye dokun</span><button class="reset-btn" data-subadd-toggle="${sub.id}">Kapat ▲</button></div>${avail.map(aw=>{
        const aHex = wordColorHex(aw.color);
        return `<div class="example-block" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;${aHex?`box-shadow:inset 6px 0 0 ${aHex};`:''}">
          <div><div class="example-de" style="font-size:15px;${deColorStyle(aHex)}">${esc(aw.de)}</div><div class="example-tr">${esc(aw.tr.join(' / '))}</div></div>
          <button class="reset-btn" data-subword-add="${aw.id}" data-subword-addsub="${sub.id}">+ ekle</button>
        </div>`;}).join('')}</div>`;
    }
  }

  return `
  <div class="card-module" style="margin-bottom:14px;">
    <div class="card-module-top">
      ${RENAME_SUB_ID===sub.id ? `
      <div class="input-row" style="max-width:220px;">
        <input type="text" id="renameSubInput" value="${esc(sub.name||'')}" placeholder="Toplu Grup" maxlength="40">
      </div>` : `<h3>${esc(subModuleLabel(sub,subIdx,m))}</h3>`}
      <div style="display:flex;gap:6px;align-items:center;">
        <span class="pill">${progLabel(prog)}</span>
        <button class="reset-btn" style="padding:4px 9px;" data-subopen="${sub.id}">Kapat ▲</button>
        ${RENAME_SUB_ID===sub.id
          ? `<button class="reset-btn" data-subrename-save="${sub.id}">Kaydet</button><button class="reset-btn" data-subrename-cancel="1">Vazgeç</button>`
          : `<button class="reset-btn" style="padding:4px 9px;" data-subrename="${sub.id}" title="Adı düzenle">✎ isim</button><button class="reset-btn" style="padding:4px 9px;" data-subdel="${sub.id}" title="Sil">− sil</button>`}
      </div>
    </div>
    <div class="cat">${wordCount} kelime · ana modülde görünmez</div>
    <div class="btn-row" style="justify-content:flex-start;margin-bottom:10px;margin-top:10px;">
      <button class="reset-btn" data-bulk-selectall="${sub.id}">Tümünü Seç${filter?' (filtre)':''}</button>
      <button class="reset-btn" data-bulk-download="${sub.id}">⬇ .txt indir</button>
      ${(isActiveSel && selCount>0) ? `<button class="reset-btn" data-bulk-clearsel="${sub.id}">Seçimi Temizle</button>` : ''}
    </div>
    ${selectionPanel}
    ${filterHtml}
    ${bulkFilterAction}
    <div style="margin-top:6px;">${wordRows}</div>
    ${addFromMainSection}
    <div class="btn-row" style="justify-content:flex-start;margin-top:12px;">
      <button class="btn btn-primary" data-substart="${sub.id}" style="padding:8px 14px;font-size:13px;">▶ Derse başla</button>
      <button class="btn btn-example" data-substart-example="${sub.id}" ${subExampleCount===0?'disabled':''} style="padding:8px 14px;font-size:13px;" title="Bu grupta 📝 çalış ile seçilmiş cümleli kelimelerle cümleli çalışma başlat">📝 Cümleli (${subExampleCount})</button>
    </div>
  </div>`;
}

        const aHex = wordColorHex(aw.color);
        return `<div class="example-block" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;${aHex?`box-shadow:inset 6px 0 0 ${aHex};`:''}">

          <button class="reset-btn" data-subword-add="${aw.id}" data-subword-addsub="${sub.id}">+ ekle</button>

    <div class="btn-row" style="justify-content:flex-start;margin-top:12px;">

}

function renderSentenceGroupCard(m, sub, subIdx){
  const sentences = sub.sentences || [];
  const isActiveSel = SEL_SENT_SUBID === sub.id;
  const sel = isActiveSel ? SELECTED_SENTENCES : new Set();
  const selCount = sel.size;
  const filter = SENTENCE_COLOR_FILTER[sub.id] || null;
  const filtered = filter
    ? sentences.filter(sc => filter==='none' ? !sc.color : sc.color === filter)

function goList(){

  BULK_ADD_OPEN=false; BULK_SENTENCE_ADD_OPEN=false;
  NEW_WORD_OPEN=false; NEW_WORD_COLOR=null; SUB_ADD_OPEN=null;
  SENTENCE_PENDING_COLOR=null; QUICK_SENT_COLOR_ID=null;
  EDIT_SENTENCE_ID=null; EDIT_SENTENCE_GROUP_ID=null;
  SUB_OPEN_IDS.clear(); SELECTED_WORDS.clear(); SELECTED_BULK_WORDS.clear();
  EXAMPLE_SELECTED.clear(); SELECTED_SENTENCES.clear();
  SEL_SENT_SUBID=null; SENT_PENDING_COLOR_PER_GROUP={}; SENTENCE_COLOR_FILTER={};
  SEL_BULK_SUBID=null; BULK_PENDING_COLOR={}; MAIN_PENDING_COLOR=undefined; COLOR_FILTER=null; QUICK_COLOR_ID=null;

function attachEditEvents(){
  const back = document.getElementById('backBtn');
  if(back) back.onclick = goList;

  document.querySelectorAll('[data-word-id]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('button, input, textarea, [data-quickcolor]')) return;
      toggleWordSelection(el.dataset.wordId);
    };
  });

  document.querySelectorAll('[data-rm-id]').forEach(el=>{
    el.onmousedown = el.ontouchstart = (e)=> e.stopPropagation();
    el.onclick = (e)=>{ e.stopPropagation(); removeWordFromModule(EDIT_MODULE, el.dataset.rmId); };
  });
  document.querySelectorAll('[data-editword]').forEach(el=>{
    el.onmousedown = el.ontouchstart = (e)=> e.stopPropagation();
    el.onclick = (e)=>{
      e.stopPropagation();
      EDIT_WORD_ID = el.dataset.editword;
      EDIT_EXAMPLE_WORD_ID = null;
      const ew = MODULES[EDIT_MODULE].words.find(w=>w.id===EDIT_WORD_ID);
      EDIT_WORD_COLOR = ew ? (ew.color||null) : null;
      render();
    };
  });
  document.querySelectorAll('[data-editword-cancel]').forEach(el=>{
    el.onclick = ()=>{ EDIT_WORD_ID = null; render(); };
  });
  document.querySelectorAll('[data-editword-save]').forEach(el=>{
    el.onclick = ()=>{
      const wId = el.dataset.editwordSave;
      const deInp2 = document.getElementById('editDe');
      const trInp2 = document.getElementById('editTr');
      updateWordInModule(EDIT_MODULE, wId, deInp2?deInp2.value:'', trInp2?trInp2.value:'');
    };
  });
  const editDeInp = document.getElementById('editDe');
  const editTrInp = document.getElementById('editTr');
  if(editDeInp){
    editDeInp.focus(); editDeInp.select();
    const saveOnEnter = (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); updateWordInModule(EDIT_MODULE, EDIT_WORD_ID, editDeInp.value, editTrInp?editTrInp.value:''); }
      if(e.key==='Escape'){ e.preventDefault(); EDIT_WORD_ID=null; render(); }
    };
    editDeInp.onkeydown = saveOnEnter;
    if(editTrInp) editTrInp.onkeydown = saveOnEnter;
  }

  document.querySelectorAll('[data-wstart]').forEach(el=>{
    el.onmousedown = el.ontouchstart = (e)=> e.stopPropagation();
    el.onclick = (e)=>{
      e.stopPropagation();
      const m = MODULES[EDIT_MODULE];
      const o = sentOwner(m, 'w:'+el.dataset.wstart);
      if(!o) return;
      const ids = (o.sentences||[]).filter(sc=>sc.de||sc.tr).map(sc=>sc.id);
      if(ids.length===0){ alert('Bu kelimede cümle yok.'); return; }
      startSentenceStep(EDIT_MODULE, o.id, ids, null);
    };
  });
  document.querySelectorAll('[data-wsent-toggle]').forEach(el=>{
    el.onmousedown = el.ontouchstart = (e)=> e.stopPropagation();
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.dataset.wsentToggle;
      if(WORD_SENT_OPEN.has(id)){ WORD_SENT_OPEN.delete(id); }
      else {
        WORD_SENT_OPEN.add(id);
        const w = MODULES[EDIT_MODULE].words.find(x=>x.id===id);
        if(w && !hasExample(w)){ SENT_ADD_OPEN.add('w:'+id); SENT_FOCUS = 'w:'+id; }
      }
      render();
    };
  });
  document.querySelectorAll('[data-sentadd-toggle]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.dataset.sentaddToggle;
      if(SENT_ADD_OPEN.has(id)) SENT_ADD_OPEN.delete(id); else { SENT_ADD_OPEN.add(id); SENT_FOCUS = id; }
      render();
    };
  });
  document.querySelectorAll('[data-sentadd-save]').forEach(el=>{
    const id = el.dataset.sentaddSave;
    const de = document.getElementById('sentAddDe_'+id), tr = document.getElementById('sentAddTr_'+id);
    const go = async ()=>{
      const ok = await addSentenceToOwner(EDIT_MODULE, id, de?de.value:'', tr?tr.value:'');
      if(ok){ SENT_FOCUS = id; render(); }
    };
    el.onclick = go;
    [de,tr].forEach(inp=>{ if(inp) inp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; });
  });
  if(SENT_FOCUS){
    const f = document.getElementById('sentAddDe_'+SENT_FOCUS);
    SENT_FOCUS = null;
    if(f) f.focus();
  }

  document.querySelectorAll('[data-selexample]').forEach(el=>{
    el.onmousedown = el.ontouchstart = (e)=> e.stopPropagation();
    el.onclick = (e)=>{ e.stopPropagation(); toggleExampleSelection(el.dataset.selexample); };
  });
  document.querySelectorAll('[data-unselexample]').forEach(el=>{
    el.onmousedown = el.ontouchstart = (e)=> e.stopPropagation();
    el.onclick = (e)=>{ e.stopPropagation(); toggleExampleSelection(el.dataset.unselexample); };
  });
  document.querySelectorAll('[data-exclearsel]').forEach(el=>{
    el.onclick = ()=> clearExampleSelection();
  });
  document.querySelectorAll('[data-exselectall]').forEach(el=>{
    el.onclick = ()=> selectAllExampleWords();
  });
  document.querySelectorAll('[data-exstartlesson]').forEach(el=>{
    el.onclick = ()=> startExampleLesson();
  });

  document.querySelectorAll('[data-sent-item]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('button, [data-sent-colorpick]')) return;
      toggleSentenceSelection(el.dataset.sentSub, el.dataset.sentItem);
    };
  });
  document.querySelectorAll('[data-sent-clearsel]').forEach(el=>{
    el.onclick = ()=>{
      const subId = el.dataset.sentClearsel;
      if(SEL_SENT_SUBID === subId){
        SELECTED_SENTENCES.clear();
        SEL_SENT_SUBID = null;
        delete SENT_PENDING_COLOR_PER_GROUP[subId];
      }
      render();
    };
  });
  document.querySelectorAll('[data-sent-selectall]').forEach(el=>{
    el.onclick = ()=>{
      const subId = el.dataset.sentSelectall;
      const m = MODULES[EDIT_MODULE];
      const sub = sentOwner(m, subId);
      if(!sub) return;
      if(SEL_SENT_SUBID !== subId){ SELECTED_SENTENCES.clear(); SEL_SENT_SUBID = subId; }
      const filter = SENTENCE_COLOR_FILTER[subId] || null;
      (sub.sentences||[]).forEach(sc=>{
        if(filter){
          if(filter === 'none' && sc.color) return;
          if(filter !== 'none' && sc.color !== filter) return;
        }
        SELECTED_SENTENCES.add(sc.id);
      });
      render();
    };
  });
  document.querySelectorAll('[data-sent-savecolor]').forEach(el=>{
    el.onclick = async ()=>{
      const subId = el.dataset.sentSavecolor;
      const color = SENT_PENDING_COLOR_PER_GROUP[subId];
      if(color === undefined) return;
      delete SENT_PENDING_COLOR_PER_GROUP[subId];
      await assignColorToSentenceSelection(EDIT_MODULE, subId, color);
    };
  });
  document.querySelectorAll('[data-sent-rm]').forEach(el=>{
    el.onmousedown = el.ontouchstart = (e)=> e.stopPropagation();
    el.onclick = (e)=>{ e.stopPropagation(); removeSentenceFromGroup(EDIT_MODULE, el.dataset.sentRmGroup, el.dataset.sentRm); };
  });
  document.querySelectorAll('[data-sent-edit]').forEach(el=>{
    el.onmousedown = el.ontouchstart = (e)=> e.stopPropagation();
    el.onclick = (e)=>{
      e.stopPropagation();
      EDIT_SENTENCE_ID = el.dataset.sentEdit;
      EDIT_SENTENCE_GROUP_ID = el.dataset.sentEditGroup;
      render();
    };
  });
  document.querySelectorAll('[data-sent-save]').forEach(el=>{
    el.onclick = async ()=>{
      const de = document.getElementById('editSentDe');
      const tr = document.getElementById('editSentTr');
      if(!de || !tr) return;
      const sId = el.dataset.sentSave;
      const gId = el.dataset.sentGroup;
      EDIT_SENTENCE_ID = null; EDIT_SENTENCE_GROUP_ID = null;
      await updateSentenceInGroup(EDIT_MODULE, gId, sId, de.value, tr.value, null);
    };
  });
  document.querySelectorAll('[data-sent-cancel]').forEach(el=>{
    el.onclick = ()=>{ EDIT_SENTENCE_ID = null; EDIT_SENTENCE_GROUP_ID = null; render(); };

/* ---------------- DERS ---------------- */
function startStep(subId, colorFilter, exampleWordIds, exampleStartStepIdx){
  CUR_SUBMODULE = subId || null;
  const mod = MODULES[CUR_MODULE];
  if(!mod){ SCREEN='list'; render(); return; }
  const sub = CUR_SUBMODULE ? (mod.subModules||[]).find(s=>s.id===CUR_SUBMODULE) : null;

  let effectiveWords;
  const isExampleMode = !!(exampleWordIds && exampleWordIds.length > 0);
  if(isExampleMode){
    const idSet = new Set(exampleWordIds);
    effectiveWords = mod.words.filter(w => idSet.has(w.id));
  } else if(sub){
    effectiveWords = mod.words.filter(w => (sub.wordIds||[]).includes(w.id));
  } else {
    effectiveWords = mainWords(mod);
  }
  if(colorFilter){
    effectiveWords = effectiveWords.filter(w => colorFilter==='none' ? !w.color : w.color===colorFilter);
  }
  if(effectiveWords.length===0){
    if(colorFilter){
      alert('Bu renkte ('+colorFilterLabel(colorFilter)+') hiç kelime yok.');
    } else if(isExampleMode){
      alert('Seçili cümleli kelimeler bulunamadı.');
    } else {
      alert(sub ? 'Bu gruptaki kelimeler silinmiş.' : 'Bu modülde henüz kelime yok.');
    }
    SCREEN = sub ? 'edit' : 'list';
    CUR_SUBMODULE = null;
    render();
    return;
  }

  let stageList, stageIdx, step, rep;
  if(isExampleMode){
    stageList = EXAMPLE_STAGE_TYPES;
    step = (typeof exampleStartStepIdx === 'number') ? exampleStartStepIdx : 0;
    if(step >= EXAMPLE_STEPS_PER_MODULE) step = EXAMPLE_STEPS_PER_MODULE - 1;
    if(step < 0) step = 0;
    stageIdx = step % stageList.length;
    rep = Math.floor(step / stageList.length);
  } else {
    stageList = STAGE_TYPES;
    const prog = PROGRESS[mod.id];
    step = prog.step;
    if(step >= STEPS_PER_MODULE) step = STEPS_PER_MODULE - 1;
    stageIdx = step % stageList.length;
    rep = Math.floor(step / stageList.length);
  }
  const stageType = stageList[stageIdx];
  const seed = step*7+13;
  const order = seededShuffle(effectiveWords, seed);
  session = {
    mod, step, stageIdx, stageType, stageList, rep, seed, order, subModuleId: CUR_SUBMODULE,
    mode: isExampleMode ? 'example' : 'main',
    colorFilter: colorFilter || null,
    exampleMode: isExampleMode,
    exampleWordIds: isExampleMode ? exampleWordIds.slice() : null,
    idx:0, correctCount:0, wrongCount:0,
    inputVal:'', feedback:null, feedbackType:null,
    selectedLeft:null, matched:[], leftShuffled:null, rightShuffled:null,
    wrongFlashKey:null,
    mcSelected:null, mcResolved:false, mcOptions:null
  };
  SCREEN = 'lesson';
  render();
}

function startSentenceStep(idx, subId, sentenceIds, colorFilter, startStepIdx){
  const m = MODULES[idx];
  if(!m) return;
  const sub = sentOwner(m, subId);
  if(!sub) return;
  let effective = (sub.sentences||[]).filter(sc => sentenceIds.includes(sc.id));
  if(colorFilter) effective = effective.filter(sc => colorFilter==='none' ? !sc.color : sc.color===colorFilter);
  if(effective.length === 0){ alert('Çalışılacak cümle bulunamadı.'); return; }
  if(!sub.progress) sub.progress = { step: 0 };

  let step = (typeof startStepIdx === 'number') ? startStepIdx : (typeof sub.progress.step === 'number' ? sub.progress.step : 0);
  if(step >= SENTENCE_STEPS_PER_MODULE) step = 0;

  const stageIdx = step % SENTENCE_STAGE_TYPES.length;
  const rep = Math.floor(step / SENTENCE_STAGE_TYPES.length);
  const stageType = SENTENCE_STAGE_TYPES[stageIdx];
  const seed = step * 7 + 13;
  const order = seededShuffle(effective, seed);

  session = {
    mode: 'sentence',
    moduleIdx: idx,
    subId,
    sentenceIds: sentenceIds.slice(),
    colorFilter: colorFilter || null,
    step, stageIdx, stageType, rep, seed, order,
    idx: 0, correctCount: 0, wrongCount: 0,
    inputVal: '', feedback: null, feedbackType: null,
    mcOptions: null, mcResolved: false, mcSelected: null
  };
  SCREEN = 'lesson';
  render();
}

function renderLesson(){
  if(session && session.mode === 'sentence') return renderSentenceLesson();
  const s = session;
  const mod = MODULES[CUR_MODULE];
  const sub = s.subModuleId ? (mod.subModules||[]).find(sm=>sm.id===s.subModuleId) : null;
  const subIdx = sub ? (mod.subModules||[]).indexOf(sub) : -1;

  let pct, progLbl;
  if(s.mode === 'example'){
    pct = exampleProgPct(s.step);
    progLbl = exampleProgLabel(s.step);
  } else {
    const prog = PROGRESS[mod.id];
    pct = progPct(prog);
    progLbl = progLabel(prog);
  }

  let badges = '';
  if(s.exampleMode){
    badges += `<span class="stage-badge example-tag">📝 Cümleli</span>`;
  }
  if(s.colorFilter){
    const cfLabel = colorFilterLabel(s.colorFilter);
    const cfHex = wordColorHex(s.colorFilter);
    const bg = cfHex || '#8A8F8A';
    badges += `<span class="stage-badge color-tag" style="background:${bg};">${esc(cfLabel)}</span>`;
  }
  badges += `<span class="stage-badge">${s.stageType}</span>`;

  let head = `
  <div class="lesson-head">
    <div class="lesson-head-row">
      <span class="back-link" id="backBtn">← Modüller</span>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        ${badges}
      </div>
    </div>
    <div class="rep-track"><div class="rep-fill" style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;">
      <span class="counter">${esc(moduleLabel(mod,CUR_MODULE))}${sub? ' · '+(subIsBulk(sub)?'📦':'🔁')+' '+esc(subModuleLabel(sub,subIdx,mod)) : ''}${s.colorFilter?' · Sadece '+esc(colorFilterLabel(s.colorFilter)):''} · Tekrar ${s.rep+1}/14</span>
      <span class="counter">${progLbl}</span>
    </div>
  </div>`;
  let body = '';
  switch(s.stageType){
    case 'HÖM': body = renderHOM(s); break;
    case 'TAHMİN': body = renderGuess(s, s.mode==='example' ? 'de2tr' : (s.rep%2===0 ? 'de2tr' : 'tr2de')); break;
    case 'TERS': body = renderGuess(s, s.rep%2===0 ? 'tr2de' : 'de2tr'); break;
    case 'EŞLEŞTİRME': body = renderMatch(s); break;
    case 'MİNİ TEST': body = renderMiniTest(s); break;
    case 'CÜMLE': body = renderCumle(s); break;
  }
  return head + '<div id="lessonBody">' + body + '</div>';
}

async function completeStep(){
  const mod = session.mod;
  const subIdAtCompletion = session.subModuleId;
  const colorFilterAtCompletion = session.colorFilter;
  const exampleIdsAtCompletion = session.exampleMode ? (session.exampleWordIds||[]).slice() : null;

  if(session.mode === 'example'){
    const nextStep = session.step + 1;
    if(nextStep >= EXAMPLE_STEPS_PER_MODULE){
      SCREEN = 'modulecomplete'; render(); return;
    }
    if(nextStep % EXAMPLE_STAGE_TYPES.length === 0){
      LAST_REP = nextStep / EXAMPLE_STAGE_TYPES.length;
      SCREEN = 'repcomplete'; render(); return;
    }
    startStep(subIdAtCompletion, colorFilterAtCompletion, exampleIdsAtCompletion, nextStep);
    return;
  }

  const prog = PROGRESS[mod.id];
  prog.step = Math.min(prog.step+1, STEPS_PER_MODULE);
  if(prog.step >= STEPS_PER_MODULE) prog.done = true;
  await saveProgress();
  if(prog.done){ SCREEN='modulecomplete'; render(); return; }
  if(prog.step % STAGE_TYPES.length === 0){
    LAST_REP = prog.step / STAGE_TYPES.length;
    SCREEN = 'repcomplete'; render(); return;
  }
  startStep(subIdAtCompletion, colorFilterAtCompletion, null);
}

async function completeSentenceStep(){
  const s = session;
  if(!s || s.mode !== 'sentence') return;
  const m = MODULES[s.moduleIdx];
  if(!m) return;
  const sub = sentOwner(m, s.subId);
  if(!sub) return;
  if(!sub.progress) sub.progress = { step: 0 };
  const nextStep = s.step + 1;

  if(nextStep >= SENTENCE_STEPS_PER_MODULE){
    sub.progress.step = 0;
    await saveProgress();
    SCREEN = 'modulecomplete';
    render();
    return;
  }

  sub.progress.step = nextStep;
  await saveProgress();

  if(nextStep % SENTENCE_STAGE_TYPES.length === 0){
    LAST_REP = nextStep / SENTENCE_STAGE_TYPES.length;
    SCREEN = 'repcomplete';
    render();
    return;
  }

  startSentenceStep(s.moduleIdx, s.subId, s.sentenceIds, s.colorFilter, nextStep);
}
